name: CI - Testes Automatizados

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter
        run: npm run lint

  unit-tests:
    name: Testes Unitários (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Rodar Testes Unitários
        run: npx vitest run

  backend-test:
    name: Backend (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Rodar Testes de Segurança (API)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python -m pytest api/tests/ -v

  frontend-test:
    name: Frontend (Cypress)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Rodar Testes de Interface (Cypress)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          # O Cypress vai testar a URL de produção real
          # Se preferir testar o preview da Vercel, a configuração é um pouco mais complexa.

      - name: Upload Cypress failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-screenshots-${{ github.run_id }}
          path: cypress/screenshots/**/*.png
          if-no-files-found: ignore
          retention-days: 7
          

          