    ger.querySelector("#addOficial").onclick = function(){
      const nome = (document.getElementById("novoOficial").value||"").trim();
      if (!nome) return;
      if (D.oficiais.indexOf(nome)>=0){ alert("Oficial já cadastrado."); return; }
      D.oficiais = ordenarOficiais(D.oficiais.concat([nome]));
      salvarOficiais(); desenhar();
    };
    ger.querySelector("#rmOficial").onclick = function(){
      const alvo = selDel.value;
      if (!alvo) return;
      const dias = {}, chaves = [];
      Object.keys(D.acoOficiais).forEach(function(k){
        const t = D.acoOficiais[k] || {};
        let usa = false;
        if (t.t1===alvo){ dias[k] = 1; usa = true; }
        if (t.t2===alvo){ dias[k] = 1; usa = true; }
        if (usa) chaves.push(k);
      });
      const nDias = Object.keys(dias).length;
      if (nDias && !confirm("O oficial "+alvo+" está lançado em "+nDias+" dia(s). Remover e esvaziar esses lançamentos?")) return;
      chaves.forEach(function(k){
        if (D.acoOficiais[k].t1===alvo) D.acoOficiais[k].t1="";
        if (D.acoOficiais[k].t2===alvo) D.acoOficiais[k].t2="";
      });
      D.oficiais = D.oficiais.filter(o=>o!==alvo);
      salvarOficiais(); salvarLocal(); desenhar();
    };
  }

  // ---------- tabela unica: oficiais + equipe + militares + situacao ----------
  const ajudaOficiais = document.createElement("p");
  ajudaOficiais.style.cssText = "font-size:11.5px;color:#495057;margin:0 0 8px";
  ajudaOficiais.textContent = "Oficiais por dia: use as listas do 1º e 2º turno (Mestre, somente em preparação). Use “adicionar” para cadastrar um nome novo.";
  main.appendChild(ajudaOficiais);
  const W_NOME = 200, W_DIA = 64, W_PJES = 74;
  const t = document.createElement("table");
  t.style.cssText = "margin:0 auto;table-layout:fixed;border-collapse:collapse";
  let cg = "<colgroup><col style='width:"+W_NOME+"px'>";
  dias.forEach(function(){ cg += "<col style='width:"+W_DIA+"px'>"; });
  cg += "<col style='width:"+W_PJES+"px'></colgroup>";
  t.innerHTML = cg;

  const thead = document.createElement("thead");
  t.appendChild(thead);

  function linhaCab(rotulo, montarCelula, classe){
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.textContent = rotulo;
    th.style.cssText = "min-width:"+W_NOME+"px;text-align:center;padding:2px 6px;font-size:11px;font-weight:700";
    tr.appendChild(th);
    dias.forEach(function(d){ tr.appendChild(montarCelula(d)); });
    const thF = document.createElement("th");
    thF.textContent = (classe === "pj") ? "PJES ACO" : "";
    thF.style.cssText = "font-size:11px;background:#4a6fa5;color:#fff;font-weight:700;text-align:center";
    tr.appendChild(thF);
    thead.appendChild(tr);
    return tr;
  }

  [["1º Turno","t1"],["2º Turno","t2"]].forEach(function(par){
    linhaCab(par[0], function(d){
      const k = fmt(d);
      const atual = ((D.acoOficiais[k]||{})[par[1]]) || "";
      const th = document.createElement("th");
      th.style.cssText = "padding:1px;vertical-align:middle;width:"+W_DIA+"px;height:44px";
      const box = document.createElement("div");
      box.style.cssText = "position:relative;width:100%;height:44px";
      const label = document.createElement("div");
      label.style.cssText = "display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;line-height:1.05;font-size:9.5px;font-weight:700;white-space:normal;pointer-events:none;text-align:center;padding:1px";
      if (atual){
        const pos = atual.lastIndexOf(" ");
        const posto = pos < 0 ? "" : atual.slice(0,pos);
        const nome = pos < 0 ? atual : atual.slice(pos+1);
        label.innerHTML = "<span>"+esc(posto)+"</span><span>"+esc(nome)+"</span>";
      } else {
        label.textContent = "—";
      }
      box.appendChild(label);
      const sel = document.createElement("select");
      sel.style.cssText = "position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;font-size:9px";
      sel.title = par[0]+" — dia "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+" — "+(atual||"—");
      const vazio = document.createElement("option");
      vazio.value = ""; vazio.textContent = "—"; sel.appendChild(vazio);
      D.oficiais.forEach(function(o){
        const op = document.createElement("option");
        op.value = o; op.textContent = o;
        if (o === atual) op.selected = true;
        sel.appendChild(op);
      });
      if (atual && D.oficiais.indexOf(atual) < 0){
        const op = document.createElement("option");
        op.value = atual; op.textContent = atual; op.selected = true;
        sel.appendChild(op);
      }
      sel.disabled = !(ehMestre() && ehPreparacao());
      if (sel.disabled) sel.style.pointerEvents = "none";
      sel.onchange = function(){
        if (!(ehMestre() && ehPreparacao())) return;
        D.acoOficiais[k] = D.acoOficiais[k] || {t1:"",t2:""};
        D.acoOficiais[k][par[1]] = this.value;
        salvarLocal(); desenhar();
      };
      box.appendChild(sel);
      th.appendChild(box);
      return th;

  linhaCab("Equipe", function(d){
    const th = document.createElement("th");
    th.textContent = equipeDoDia(d);
    th.style.cssText = "font-size:10px;font-weight:600;width:"+W_DIA+"px";
    return th;
  });

  const trDias = document.createElement("tr");
  const thD = document.createElement("th");
  thD.textContent = "MILITAR";
  thD.style.cssText = "text-align:center;padding:2px 6px;font-size:11px;font-weight:700";
  trDias.appendChild(thD);
  dias.forEach(function(d){
    const th = document.createElement("th");
    th.textContent = String(d.getDate()).padStart(2,"0");
    const c = corDia(d);
    if (c) th.style.color = ehFds(d) ? "#ffb3a7" : c;
    th.style.cssText += "font-size:11px;width:"+W_DIA+"px";
    trDias.appendChild(th);
  });
  const thP = document.createElement("th");
  thP.textContent = "PJES";
  thP.style.cssText = "font-size:11px";
  trDias.appendChild(thP);
  thead.appendChild(trDias);

  const tb = document.createElement("tbody");
  t.appendChild(tb);

  const linhas = [];
  const nLinhasAco = Math.max(20, aco.length);
  for (let i=0;i<nLinhasAco;i++) linhas.push(aco[i] ? D.mes.find(function(m){ return m.id===aco[i]; }) : null);

  linhas.forEach(function(m, idx){
    const tr = document.createElement("tr");
    if (m) tr.classList.add("linhaMilitar");
    if (m) tr.dataset.militarId = m.id;
    const tdN = document.createElement("td");
    tdN.className = "nome";
    tdN.style.cssText = "text-align:left;padding:2px 6px;font-size:11px;overflow:hidden;text-overflow:ellipsis";
    const podeRenderSelect = ehMestre() || !m || (m && m.secao === perfilAtual);
    if (podeRenderSelect){
      const sel = document.createElement("select");
      sel.className = "selMilitar";
      sel.style.cssText = "width:100%";
      const alvoSec = ehMestre() ? null : perfilAtual;
      sel.innerHTML = "<option value=''>—</option>"
        + D.pessoas.filter(function(p){
            if (!alvoSec) return true;
            const mm = D.mes.find(function(x){ return x.id===p.id; });
            return mm && mm.secao === alvoSec;
          }).map(function(p){
            const nm = (p.posto+" "+p.id+" "+p.nome).trim();
            return "<option value='"+p.id+"'"+(m && m.id===p.id?" selected":"")+">"+nm+"</option>";
          }).join("");
      sel.onchange = function(){
        if (trocarMilitar("ACO", aco, idx, sel.value||null) === false){ sel.value = (m?m.id:""); return; }
        salvarLocal(); desenhar();
      };
      tdN.appendChild(sel);
      anexarBuscaMilitar(sel);
      if (m && !podeEditarAco(m.id)) tr.style.opacity = "0.55";
    } else {
      if (m){
        const pe = D.pessoas.find(function(x){ return x.id === m.id; }) || {};
        tdN.textContent = [pe.posto||"", pe.nome||m.id, "("+m.id+")"].filter(function(x){ return x; }).join(" ");
        if (!podeEditarAco(m.id)) tr.style.opacity = "0.55";
      }
    }
    tr.appendChild(tdN);

    dias.forEach(function(d){
      const td = document.createElement("td");
      const id = m ? m.id : null;
      const dd = fmt(d);
      td.dataset.dia = dd;
      const v = id ? (marks["ACO|"+id+"|"+dd]||"") : "";
      td.className = "dia";
      td.textContent = v;
      td.style.width = W_DIA+"px";
      if (v==="12"){ td.style.background="#8d6e63"; td.style.color="#fff"; td.style.fontWeight="700"; }
      if (v==="24"){ td.style.background="#37474f"; td.style.color="#fff"; td.style.fontWeight="700"; }
      if (v==="N") pintar(td, "N", m ? m.escala : null);
      let overlay = null;
      if (!v && id){
        const achados = marcasDoMilitarDia(id, dd).filter(function(x){
          return x.grupo !== "ACO" && ["X","PJ","PJ12","SPJ","N","Nm"].indexOf(x.cod) >= 0;
        });
        if (achados.length) overlay = achados[0];
        else if (m && estaAfastado(m, d)) overlay = {grupo:"", cod:"N"};
      }
      if (overlay){
        td.textContent = (overlay.cod === "Nm" ? "N" : overlay.cod);
        pintar(td, overlay.cod, m ? m.escala : null);
        td.style.opacity = "1";
        if (overlay.cod !== "N") celulaFora(td);
        if (overlay.cod === "X") pintarXFora(td, m ? m.escala : null);
        td.title = "Escala: " + overlay.cod + (overlay.grupo ? " na "+localDoGrupo(overlay.grupo) : " (afastado)");
      }
      if (!id || !podeEditarAco(id)){
        if (!(v==="12" || v==="24")) td.classList.add(overlay ? "escalaAcoLeitura" : (v==="N" ? "somenteLeituraN" : "somenteLeitura"));
      } else {
        td.onclick = function(){
          abrirMenuCodigos(td, ["12","24"], function(cod){
            if (marcar("ACO", id, fmt(d), cod)) desenhar();
          });
        };
      }
      tr.appendChild(td);
    });

    const tdC = document.createElement("td");
    tdC.className = "num";
    tdC.textContent = m ? (cotasAcoMilitar(m.id) || "") : "";
    tr.appendChild(tdC);
    tb.appendChild(tr);
  });

  const trT = document.createElement("tr");
  const tdt = document.createElement("td");
  tdt.textContent = "Total de PJES";
  tdt.style.cssText = "text-align:right;padding:2px 6px;font-size:11px;font-weight:700";
  trT.appendChild(tdt);
  dias.forEach(function(d){
    const td = document.createElement("td");
    td.className = "num";
    td.style.width = W_DIA+"px";
    td.textContent = acoLancado(fmt(d)) || "";
    trT.appendChild(td);
  });
  const tdTot = document.createElement("td");
  tdTot.className = "num";
  tdTot.style.fontWeight = "700";
  tdTot.textContent = cotasAcoMes() || "";
  trT.appendChild(tdTot);
  tb.appendChild(trT);

  const trS = document.createElement("tr");
  const tds = document.createElement("td");
  tds.textContent = "Situação";
  tds.style.cssText = "text-align:right;padding:2px 6px;font-size:11px";
  trS.appendChild(tds);
  dias.forEach(function(d){
    const s = situacaoAco(fmt(d));
    const td = document.createElement("td");
    td.className = s.classe || "num";
    td.style.cssText = "font-size:9px;width:"+W_DIA+"px";
    td.textContent = s.texto;
    trS.appendChild(td);
  });
  trS.appendChild(document.createElement("td"));
  tb.appendChild(trS);

  t.className = "aco";
  t.style.minWidth = (W_NOME + dias.length*W_DIA + W_PJES + 20) + "px";
  const wrap = document.createElement("div");
  wrap.dataset.scrollKey = "aco";
  wrap.style.cssText = "overflow:visible;max-width:none;border:1px solid #dee2e6;border-radius:4px;margin:0 auto";
  wrap.appendChild(t);
  main.appendChild(wrap);
  if (ehMestre() || SBS.includes(perfilAtual)){
    const addAco = document.createElement("button");
    addAco.id = "addAcoLinha";
    addAco.textContent = "+ linha";
    addAco.title = "Acrescentar uma linha de militar na ACO";
    addAco.style.cssText = "margin:8px 0 0;padding:4px 12px;font-size:12px;border:1px solid #adb5bd;border-radius:6px;background:#fff;cursor:pointer";
    addAco.onclick = function(){
      while (aco.length < 20) aco.push(null);
      aco.push(null);
      salvarLocal(); desenhar();
      status("linha adicionada à ACO");
    };
    main.appendChild(addAco);
  }

  // ---------- comparativo Destinadas / Lancadas / Saldo ----------
  const dest = Number((D.params.cotas||{})["ACO"]||0);
  const lanc = cotasAcoMes();
  const saldo = dest - lanc;
  const cmp = document.createElement("div");
  cmp.style.cssText = "margin-top:14px;font-size:13px;display:flex;gap:18px;flex-wrap:wrap;align-items:center";
  cmp.innerHTML = "<b>Cotas ACO</b> &nbsp; Destinadas: <b>"+dest+"</b>"
    + " &nbsp;·&nbsp; Lançadas: <b>"+lanc+"</b>"
    + " &nbsp;·&nbsp; Saldo: <b style='color:"+(saldo<0?"#842029":"#14532d")+"'>"+saldo+"</b>"
    + (saldo>0 ? " <span style='color:#8a6d3b'>(sobra)</span>" : "")
    + (ehMestre() ? " &nbsp; <input id='cotaAco' type='number' min='0' step='1' style='width:70px;text-align:center' value='"+dest+"'>" : "");
  main.appendChild(cmp);
  if (ehMestre()){
    const inp = cmp.querySelector("#cotaAco");
    inp.onchange = function(){
      D.params.cotas = D.params.cotas || {};
      D.params.cotas["ACO"] = Math.max(0, Math.floor(Number(inp.value)||0));
      salvarLocal(); desenhar();
    };
  }

  // ---------- importar ACO de uma SB ----------
  if (ehMestre()){
    const imp = document.createElement("div");
    imp.style.cssText = "margin-top:12px;font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap";
    imp.innerHTML = "<b>Importar ACO de uma SB:</b> <select id='impSb' style='font-size:12px;padding:2px'>"
      + SBS.map(s=>"<option>"+s+"</option>").join("") + "</select>"
      + "<button id='impBtn' style='padding:3px 10px'>escolher arquivo</button>"
      + "<input type='file' id='impFile' accept='.json' style='display:none'>"
      + "<span id='impMsg' style='color:#495057'></span>";
    main.appendChild(imp);
    imp.querySelector("#impBtn").onclick = function(){ document.getElementById("impFile").click(); };
    imp.querySelector("#impFile").onchange = function(ev){
      const f = ev.target.files[0]; if (!f) return;
      const sbAlvo = document.getElementById("impSb").value;
      const r = new FileReader();
      r.onload = function(){
        try{
          const j = JSON.parse(r.result);
          const ids = new Set(D.mes.filter(m=>m.secao===sbAlvo).map(m=>m.id));
          const novos = j.marks || {};
          const aplicar = {};
          let qtd = 0;
          Object.keys(novos).forEach(function(k){
            const p = k.split("|");
            if (p[0]==="ACO" && ids.has(p[1])){ aplicar[k] = novos[k]; qtd++; }
          });
          if (!qtd){ alert("Nenhuma marca ACO da "+sbAlvo+" encontrada no arquivo."); return; }
          if (!confirm("Aplicar "+qtd+" marca(s) ACO dos militares da "+sbAlvo+"?")) return;
          Object.keys(aplicar).forEach(function(k){ marks[k] = aplicar[k]; });
          salvarLocal(); desenhar();
          document.getElementById("impMsg").textContent = qtd+" marca(s) aplicada(s).";
        }catch(e){ alert("arquivo inválido"); }
      };
      r.readAsText(f);
    };
  }
}

// ===== 9.3 DIARIO =====
const DIAS_ABREV=["dom","seg","ter","qua","qui","sex","sáb"];
function desenharDiario(main){
  const dias=diasDoMes();
  const t=document.createElement("table");
  t.className="diario";
  let h="<thead><tr><th colspan='2' rowspan='2' style='min-width:194px'>RESUMO POR DIA</th>"+
        "<th colspan='"+dias.length+"'>ESCALA POR DIA</th>"+
        "<th colspan='2'>MÉDIAS</th></tr><tr>";
  dias.forEach(d=>{
    const fds=fimDeSemanaOuFeriado(d);
    h+="<th"+(fds?" style='color:#a93226'":"")+">"+String(d.getDate()).padStart(2,"0")+". "+DIAS_ABREV[d.getDay()]+"</th>";
  });
  h+="<th>(mês 30)</th><th>(mês 31)</th></tr></thead><tbody>";
  t.innerHTML=h;

  function bloco(nome, defs, destaque){
    defs.forEach((cfg,idx)=>{
      const rot=cfg[0], fn=cfg[1], alvo=cfg[2], cor=cfg[3];
      const tr=document.createElement("tr");
      if (destaque) tr.className="tot";
      tr.innerHTML=(idx===0?"<td rowspan='"+defs.length+"' class='sbcell'>"+nome+"</td>":"")+
                   "<td class='mot' style='font-weight:700'>"+rot+"</td>";
      let soma=0;
      dias.forEach(d=>{
        const v=fn(d); soma+=v;
        const td=document.createElement("td");
        td.className="num dia-v";
        td.textContent=v?String(v).replace(".",","):"";
        if (alvo && v>=alvo) td.style.background=cor;
        tr.appendChild(td);
      });
      const m30=document.createElement("td"); m30.className="num"; m30.textContent=(soma/30).toFixed(2).replace(".",",");
      const m31=document.createElement("td"); m31.className="num"; m31.textContent=(soma/31).toFixed(2).replace(".",",");
      tr.appendChild(m30); tr.appendChild(m31);
      t.appendChild(tr);
    });
  }

  SBS.forEach(sb=>{
    const meta = D.params.metaBM[sb]||0, metaMot = D.params.metaMot[sb]||0;
    bloco(sb, [["BM", d=>contagemSB(sb,d), meta, "#d9ead3"],
               ["MOT.", d=>motoristasSB(sb,d), metaMot, "#cfe2f3"]]);
  });
  function acoMilitaresDia(d){
    let n=0;
    aco.forEach(id=>{
      if (!id) return;
      const v=marks["ACO|"+id+"|"+fmt(d)];
      if (v==="24") n+=1; else if (v==="12") n+=0.5;
    });
    return n;
  }
  bloco("ACO", [["BM", d=>acoMilitaresDia(d), 0, "#d9ead3"]]);
  bloco("7ºGB", [["BM", d=>SBS.reduce((a,sb)=>a+contagemSB(sb,d),0)+acoMilitaresDia(d), 0, "#d9ead3"],
                 ["MOT.", d=>SBS.reduce((a,sb)=>a+motoristasSB(sb,d),0), 0, "#cfe2f3"]], true);

  main.appendChild(t);
  const p=document.createElement("p");
  p.className="diarioLegenda";
  p.textContent="Valores por dia. Coluna MÉDIAS: soma do mês dividida por 30 e por 31 dias.";
  main.appendChild(p);
}

function localDoGrupo(g){
  if (g==="ACO") return "ACO";
  return g.replace(/^ADM:/,"").replace(/^host:/,"");
}
function desenharConfIndiv(main){
  const dias = diasDoMes();
  D.confFixos = (D.confFixos || []).filter(function(id){ return podeEditarConfMilitar(id); });

  const bar = document.createElement("div");
  bar.className = "confBar";
  bar.innerHTML = "<b>CONF. INDIV.</b> — conferência individual (somente leitura)"
    + " &nbsp; <b>Militar:</b> <select id='confSel'></select>"
    + " <button id='confAdd'>fixar</button>"
    + " <button id='confLimpar'>limpar</button>"
    + " <span id='confMsg' style='color:#842029;font-size:12px'></span>";
  main.appendChild(bar);
  const sel = bar.querySelector("#confSel");
  sel.className = "selMilitar";
  sel.innerHTML = "<option value=''>— escolher militar —</option>"
    + D.pessoas.filter(function(p){
        return D.mes.some(function(x){ return x.id===p.id; }) && podeEditarConfMilitar(p.id);
      })
      .map(function(p){ return "<option value='"+esc(p.id)+"'>"+esc((p.posto+" "+p.id+" "+p.nome).trim())+"</option>"; }).join("");
  anexarBuscaMilitar(sel);
  if (!ehMestre()){
    const av = document.createElement("p");
    av.style.cssText = "margin:-4px 0 10px;font-size:11.5px;color:#8a6d3b";
    av.textContent = "Perfil "+perfilAtual+": você só pode fixar militares da sua SB e visitantes da sua SB.";
    main.appendChild(av);
  }
  bar.querySelector("#confAdd").onclick = function(){
    const id = sel.value; if (!id) return;
    if (!podeEditarConfMilitar(id)){
      document.getElementById("confMsg").textContent = "Este militar não é da sua SB.";
      return;
    }

// ===== 9.5 CONFERÊNCIA =====
function conferenciaAchados(){
  const tipos = { xFora:0, duasCamadas:0, duasCamadasEspelho:0, duasCamadasEntre:0,
                  visitante:0, afastamento:0, legado:0, cadastro:0 };
  const linhas = [];
  const mesPorId = {};
  D.mes.forEach(function(m){ mesPorId[m.id] = m; });

  const marcasPorDia = {};
  Object.keys(marks||{}).forEach(function(k){
    const v = marks[k];
    if (!v) return;
    const p = k.split("|");
    const chave = p[1] + "|" + p[2];
    if (!marcasPorDia[chave]) marcasPorDia[chave] = [];
    if (v === "N" || v === "Nm") return; // N/Nm não conta como camada
    marcasPorDia[chave].push({grupo:p[0], cod:v});
  });

  // 1) X fora da escala do dia (somente na propria SB do militar)
  Object.keys(marks||{}).forEach(function(k){
    const v = marks[k];
    if (!v) return;
    const p = k.split("|");
    const g = p[0], id = p[1], dia = p[2];
    const m = mesPorId[id];
    if (!m) return;
    if (v === "X" && g === m.secao && ORDEM_ESC[m.escala] != null && ORDEM_ESC[m.escala] < 4){
      const idx = indiceEquipe(new Date(dia + "T12:00:00"));
      if (idx !== ORDEM_ESC[m.escala]){
        tipos.xFora++;
        linhas.push({tipo:"xFora", sb:m.secao, id:id, dia:dia,
          detalhe:"X em dia de " + EQUIPES[idx] + " (escala " + m.escala + ")"});
      }
    }
  });

  // 2) duas camadas no mesmo dia; espelho host+SB entra no contador, nao na lista
  Object.keys(marcasPorDia).forEach(function(chave){
    const lista = marcasPorDia[chave];
    if (lista.length < 2) return;
    const partes = chave.split("|");
    const id = partes[0], dia = partes[1];
    const m = mesPorId[id] || {secao:"?", escala:"?"};
    const hosts = lista.filter(function(x){ return x.grupo.indexOf("host:") === 0; });
    const proprio = lista.filter(function(x){ return x.grupo === m.secao; });
    tipos.duasCamadas++;
    if (hosts.length === 1 && proprio.length === 1 && lista.length === 2){
      tipos.duasCamadasEspelho++;
      return;
    }
    tipos.duasCamadasEntre++;
    const det = lista.map(function(x){ return x.grupo + "=" + x.cod; }).join(" · ");
    linhas.push({tipo:"duasCamadas", sb:m.secao, id:id, dia:dia,
      detalhe:"marcas em " + lista.length + " locais: " + det});
  });

  // 3) visitante listado na propria SB
  Object.keys(vis||{}).forEach(function(sb){
    const vistos = {};
    (vis[sb]||[]).forEach(function(id){
      if (!id || vistos[id]) return;
      vistos[id] = 1;
      const m = mesPorId[id];
      if (m && m.secao === sb){
        tipos.visitante++;
        linhas.push({tipo:"visitante", sb:sb, id:id, dia:"—",
          detalhe:"visitante listado na própria SB"});
      }
    });
  });

  // 4) marca em dia de afastamento
  const vistosAf = {};
  Object.keys(marks||{}).forEach(function(k){
    const v = marks[k];
    if (!v || v === "N" || v === "Nm" || v === "SB") return;
    const p = k.split("|");
    const id = p[1], dia = p[2];
    const chave = id + "|" + dia;
    if (vistosAf[chave]) return;
    const m = mesPorId[id];
    if (m && estaAfastado(m, new Date(dia + "T12:00:00"))){
      vistosAf[chave] = 1;
      tipos.afastamento++;
      linhas.push({tipo:"afastamento", sb:m.secao, id:id, dia:dia,
        detalhe:"marca " + v + " em dia de afastamento"});
    }
  });

  // 5) legado: PJ12H em qualquer grupo e SPJ fora do ADM (SB fica no aviso, nao aqui)
  avisosLegadoDados().forEach(function(a){
    if (a.cod !== "PJ12H" && a.cod !== "SPJ") return;
    tipos.legado++;
    linhas.push({tipo:"legado", sb:a.grupo.replace(/^ADM:/,"").replace(/^host:/,""),
      id:a.id, dia:a.dia,
      detalhe:(a.cod === "PJ12H" ? "código PJ12H legado" : "SPJ fora do ADM")});
  });

  // 6) cadastro duplicado
  const contIds = {};
  D.mes.forEach(function(m){ contIds[m.id] = (contIds[m.id]||0) + 1; });
  Object.keys(contIds).forEach(function(id){
    if (contIds[id] > 1){
      const m = mesPorId[id] || {secao:"—"};
      tipos.cadastro++;
      linhas.push({tipo:"cadastro", sb:m.secao, id:id, dia:"—",
        detalhe:"id repetido " + contIds[id] + "× no elenco"});
    }
  });

  linhas.sort(function(a,b){
    if (a.sb !== b.sb) return a.sb < b.sb ? -1 : 1;
    if (a.dia !== b.dia) return a.dia < b.dia ? -1 : 1;
    if (a.tipo !== b.tipo) return a.tipo < b.tipo ? -1 : 1;
    return 0;
  });
  return {tipos:tipos, linhas:linhas};
}

function navegarConferencia(x){
  if (!x || !/^\d{4}-\d{2}-\d{2}$/.test(String(x.dia||""))) return;
  if (SBS.indexOf(x.sb) < 0 && x.sb !== "ACO") return;
  abaAtual = x.sb;
  ajusteEscalaSel = null;
  ajusteEscalaAberto = false;
  desenhar();
  setTimeout(function(){
    const alvos = document.querySelectorAll("#main tr[data-militar-id]");
    let cell = null;
    for (let i=0;i<alvos.length;i++){
      const tr = alvos[i];
      if (tr.dataset.militarId !== x.id) continue;
      const tds = tr.querySelectorAll("td[data-dia]");
      for (let j=0;j<tds.length;j++){
        if (tds[j].dataset.dia === x.dia){ cell = tds[j]; break; }
      }
      if (cell) break;
    }
    if (!cell) return;
    cell.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
    cell.classList.add("destaqueConferencia");
    setTimeout(function(){ cell.classList.remove("destaqueConferencia"); }, 2100);
  }, 40);
}

// ===== 9.6 OPERACIONAL =====
function desenharOperacional2(main){
  const dias=diasDoMes(), ndias=dias.length;
  const mestre = ehMestre();
  const h=document.createElement("p"); h.className="setor";
  h.textContent="OPERACIONAL — PJES do mês, distribuição e metas diárias";
  main.appendChild(h);

  function reservaAdm(){
    return Number(((D.params||{}).cotas||{}).ADM || 0);
  }
  function reservaAco(){
    return Number(((D.params||{}).cotas||{}).ACO || 0);
  }
  function somaCotasIndividuaisAdm(){
    let r=0; D.mes.forEach(function(m){ if(m.adm==="S") r += Number(m.cotasAdm||0); }); return r;
  }
  const norm = v => String(v==null?"":v).trim().toUpperCase();
  function servDisponivel(m){
    const nd = diasDoMes().length;
    const esc = String((m && m.escala) || "").toUpperCase().replace(/\s+/g,"");
    // Deriva a equipe base de X-* para que a disponibilidade use a mesma
    // proporção (nd/4) da escala de origem, não o ramo genérico (nd-dAf)/4.
    const isX = esc.indexOf("X-") === 0;
    const escalaBase = isX ? (m.escalaOrigem || MAPA_X[esc] || esc) : esc;
    const gi = ORDEM_ESC[escalaBase];
    const ehEquipe = (gi!=null && gi<4);
    const dAf = diasAfastados(m);
    if (ehEquipe) return Math.max(0, nd/4 - dAf);
    return Math.max(0, (nd - dAf)/4);
  }
  function servDispSB(sb){
    let tot=0; pessoasDaSecao(sb).forEach(m=>{ tot += servDisponivel(m); }); return tot;
  }
  function servAdm(sb){
    let s=0;
    D.mes.forEach(m=>{ if (m.adm==="S" && m.secao===sb && !m.restricao) s += saldosDevidos(m)/2; });
    return s;
  }
  const EQUIPES = ["ALFA","BRAVO","CHARLIE","DELTA"];
  const necSB={}, necMot={}, detMot={};
  SBS.forEach(sb=>{
    const efet=pessoasDaSecao(sb).length;
    necSB[sb]= Math.ceil(2*Math.max(0,(D.params.metaBM[sb]||0)*ndias - servDispSB(sb) - servAdm(sb)));
    const Mm = D.params.metaMot[sb]||0;
    const det = {}, detBase = {}, detDelta = {}; let deficit = 0;
    EQUIPES.forEach(e=>{
      const gi = ORDEM_ESC[e];
      const motoristas = pessoasDaSecao(sb).filter(m=>norm(m.escala)===e && norm(m.motorista)==="M");
      const n = motoristas.length;
      det[e] = n;
      const faltaBase = Math.max(0, Mm - n);
      const base = faltaBase * (ndias/4);
      const diasServico = diasDoMes().filter(d=>indiceEquipe(d)===gi);
      let delta = 0;
      diasServico.forEach(d=>{
        const disp = motoristas.filter(m=>!estaAfastado(m,d)).length;
        delta += Math.max(0, Mm - disp) - faltaBase;
      });
      deficit += base + delta;
      detBase[e] = base;
      detDelta[e] = delta;
    });
    detMot[sb]={det:det, meta:Mm, base:detBase, delta:detDelta};
    necMot[sb]= Math.ceil(deficit*2);
  });
  function temMarcacao(sb){
    for (const k in marks){
      const p=k.split("|");
      if (!marks[k]) continue;
      if (marks[k]==="SB" || marks[k]==="N") continue;
      if (p[0]===sb || p[0]==="ADM:"+sb || p[0]==="host:"+sb) return true;
    }
    return false;
  }

  const box=document.createElement("div");
  box.style.cssText="margin:6px 0 14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px";
  box.innerHTML="<label><b>PJES recebido no SEI:</b> <input id='seitotal' type='number' min='0' style='width:90px;text-align:center' value='"+(D.params.sei||"")+"'"+(mestre?"":" disabled")+"></label>"+
    (mestre?"<button id='btnprop' style='padding:5px 12px;border:1px solid #adb5bd;border-radius:6px;background:#fff;cursor:pointer;font-size:12px'>Distribuir proporcional</button>":"")+
    "<span id='confsei' style='font-size:12px'></span>"+
    "<span id='disponivelSB' style='font-size:12px;font-weight:700'></span>";
  main.appendChild(box);

  const t=document.createElement("table");
  t.style.cssText="margin:0 auto";
  t.innerHTML="<thead><tr><th>SB</th><th>Meta BM/dia</th><th>Meta mot./dia</th><th>Efetivo</th>"+
    "<th>Efetivo mot.</th><th>Necessidade</th><th>Nec. mot.</th><th>Distribuído</th>"+
    "<th>Utilizado</th><th>Falta lançada</th><th>Saldo</th><th>Situação</th></tr></thead><tbody></tbody>";
  const tb=t.querySelector("tbody");
  const tot={efet:0, efetMot:0, nec:0, necMot:0, dist:0, util:0, falta:0, saldo:0};

  SBS.forEach(sb=>{
    const efet=pessoasDaSecao(sb).length;
    const efetMot=pessoasDaSecao(sb).filter(m=>m.motorista==="M").length;
    const nec=necSB[sb], ncm=necMot[sb];
    const dist=cotaAtualSB(sb);
    const util=somarCotas([sb,"host:"+sb]);
    let falta=0; const temM = temMarcacao(sb);
    if (temM) dias.forEach(d=>{ falta += 2*Math.max(0,(D.params.metaBM[sb]||0)-contagemSB(sb,d)); });
    const saldo=dist-util;

    const d= tot.dist-sei;
    let a = d===0 ? "<span style='color:#14532d'>distribuição confere</span>"
            : (d<0 ? "<span style='color:#8a6d3b'>faltam distribuir "+(-d)+"</span>"
                   : "<span style='color:#842029'>distribuído "+d+" acima do recebido</span>");
    const n=disp-somaAlvos;
    let b = "<span style='color:"+(n<0?"#842029":"#14532d")+"'>"+(n<0?("faltam "+(-n)+" cotas"):("sobram "+n+" cotas"))+"</span>";
    el.innerHTML="<b>Distribuído vs Recebido:</b> "+a+" &nbsp;·&nbsp; <b>Disponível para as SBs vs Necessidade (com motoristas):</b> "+b;
  }
  atualizarConferencia();

  setTimeout(()=>{
    const si=document.getElementById("seitotal");
    if (si && mestre) si.onchange=()=>{ D.params.sei=Math.max(0,Math.floor(Number(si.value)||0)); salvarLocal(); desenhar(); };
    document.querySelectorAll(".op").forEach(el=>{
      if (!mestre) { el.disabled = true; return; }
      el.onchange=()=>{
        const v=Math.max(0,Math.floor(Number(el.value)||0));
        if (el.dataset.k === "cotas"){
          const atual = cotaAtualSB(el.dataset.sb);
          const delta = v - atual;
          if (delta !== 0){
            D.params.cotas[el.dataset.sb] = Math.max(0, (D.params.cotas[el.dataset.sb]||0) + delta);
          }
        } else {
          D.params[el.dataset.k][el.dataset.sb] = v;
        }
        salvarLocal(); desenhar();
      };
    });
    const bp=document.getElementById("btnprop");
    if (bp) bp.onclick=async ()=>{
      const adm=reservaAdm(), aco=reservaAco();
      if (adm+aco > (D.params.sei||0)) { alert("ADM ("+adm+") + ACO ("+aco+") é maior que o recebido no SEI ("+(D.params.sei||0)+"). Ajuste as reservas."); return; }
      const rec = Math.max(0, (D.params.sei||0) - adm - aco);
      const alvo={}; let somaAlvos=0;
      SBS.forEach(sb=>{ alvo[sb]=Math.max(necSB[sb], necMot[sb]); somaAlvos+=alvo[sb]; });
      if (!rec) { alert("Informe primeiro o total recebido no SEI (ou as reservas consumiram tudo)."); return; }
      if (somaAlvos<=0) { alert("A soma dos alvos é zero; não há como distribuir."); return; }
      const jaPreenchido=SBS.some(sb=>(D.params.cotas[sb]||0)>0);
      if (jaPreenchido && !(await modalConfirm("Isso vai sobrescrever as cotas já distribuídas às SBs. Continuar?", {perigo:true}))) return;
      if ((D.movimentos||[]).length){
        if (!(await modalConfirm("Há "+D.movimentos.length+" movimento(s) de cota registrados. Distribuir proporcional vai ZERAR esses movimentos e redefinir a base a partir dos alvos atuais. Continuar?", {perigo:true}))) return;
        D.movimentos = [];
      }
      let base={}, resto=[];
      if (rec >= somaAlvos){
        SBS.forEach(sb=>{ base[sb]=alvo[sb]; });
        const sobraTotal = rec - somaAlvos;
        SBS.forEach(sb=>{ const bruto = sobraTotal*alvo[sb]/somaAlvos;
          base[sb]+=Math.floor(bruto); resto.push({sb:sb, r:bruto-Math.floor(bruto)}); });
        let sobra = rec - SBS.reduce((a,sb)=>a+base[sb],0);
        resto.sort((x,y)=>y.r-x.r);
        for (let i=0; sobra>0 && i<resto.length; i++){ base[resto[i].sb]++; sobra--; }
      } else {
        SBS.forEach(sb=>{ const bruto=rec*alvo[sb]/somaAlvos;
          base[sb]=Math.floor(bruto); resto.push({sb:sb, r:bruto-base[sb]}); });
        let sobra = rec - SBS.reduce((a,sb)=>a+base[sb],0);
        resto.sort((x,y)=>y.r-x.r);
        for (let i=0; sobra>0 && i<resto.length; i++){ base[resto[i].sb]++; sobra--; }
        alert("O disponível para as SBs ("+rec+") é menor que a necessidade somada ("+somaAlvos+"). A distribuição foi feita proporcionalmente e nem todas as SBs atingem a meta.");
      }
      SBS.forEach(sb=>{ D.params.cotas[sb]=base[sb]; });
      salvarLocal(); desenhar();
    };
  },0);
}

// ===== 9.7 MILITARES =====
function desenharMilitares(main){
  if (!ehMestre()){
    const av = document.createElement("p");
    av.style.cssText = "color:#8a6d3b;font-size:12.5px";
    av.textContent = "Aba exclusiva do perfil Mestre. O cadastro fica oculto para o perfil "+perfilAtual+".";
    main.appendChild(av); return;
  }
  const h=document.createElement("p"); h.className="setor milToolbar";
  h.innerHTML="MILITARES DO MÊS &nbsp; <select id='novoMil'><option value=''>— adicionar militar —</option></select>";
  main.appendChild(h);
  // Resumo: total, disponíveis (0 dias), parciais (1–19 dias) e integrais (>=20 dias).
  // Dias afastados por militar = soma dos dias de todos os intervalos no mês.
  (function(){
    const totalMes = D.mes.length;
    let parciais = 0, integrais = 0;
    D.mes.forEach(function(m){
      let diasAf = 0;
      (m.afast||[]).forEach(function(a){ diasAf += diasNoMesDoIntervalo(a); });
      if (diasAf > 0){
        if (diasAf < 20) parciais++;
        else integrais++;
      }
    });
    const totalAfast = parciais + integrais;
    const totalDisp = totalMes - totalAfast;
    const resumo = document.createElement("div");
    resumo.style.cssText = "display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 12px;font-size:12px";
    resumo.innerHTML =
        "<span style='background:#eef2f7;padding:4px 10px;border-radius:6px' title='Total de militares no elenco deste mês'><b>Total no mês:</b> "+totalMes+"</span>"
      + "<span style='background:#d9ead3;padding:4px 10px;border-radius:6px' title='Militares sem afastamento neste mês'><b>Disponíveis:</b> "+totalDisp+"</span>"
      + "<span style='background:#fff3cd;padding:4px 10px;border-radius:6px' title='Militares com menos de 20 dias afastados neste mês'><b>Afastados parciais:</b> "+parciais+"</span>"
      + "<span style='background:#f8d7da;padding:4px 10px;border-radius:6px' title='Militares com 20 dias ou mais afastados neste mês'><b>Afastados integrais:</b> "+integrais+"</span>";
    main.appendChild(resumo);
  })();
  const jaTem = new Set(D.mes.map(m=>m.id));
  const selNovo = h.querySelector("#novoMil");
  selNovo.className = "selMilitar";
  D.pessoas.forEach(p=>{
    if (jaTem.has(p.id)) return;
    const o=document.createElement("option");
    o.value=p.id; o.textContent=(p.posto+" "+p.id+" "+p.nome);
    selNovo.appendChild(o);
  });
  anexarBuscaMilitar(selNovo);
  selNovo.onchange=function(){
    if(!this.value) return;
    const idN = this.value;
    const reg = (D.removidos && D.removidos[idN]) ? D.removidos[idN] : null;
    if (reg){
      D.mes.push({id:idN, secao:reg.secao||"1ªSB", escala:reg.escala||"ALFA",
        motorista:reg.motorista||"", adm:reg.adm||"",
        cotasAdm:reg.cotasAdm||0, restricao:!!reg.restricao, afast:reg.afast||[],
        escalaOrigem: reg.escalaOrigem || null,
        escalaOrigemAdm: reg.escalaOrigemAdm || null});
      delete D.removidos[idN];
      status("readicionado com os dados anteriores");
    } else {
      D.mes.push({id:idN, secao:"1ªSB", escala:"ALFA", motorista:"", adm:""});
      status("adicionado");
    }
    migrarAdmSemEscala();
    salvarLocal(); desenhar();
  };
  if (ehMestre()){
    const bx = document.createElement("button");
    bx.className = "milAction";
    bx.textContent = "Preencher X automáticos que faltam neste mês";
    bx.onclick = function(){
      const n = D.mes.filter(function(m){
        if (m.adm==="S" || m.restricao) return false;
        const gi = ORDEM_ESC[String(m.escala||"").toUpperCase().replace(/\s+/g,"")];
        if (gi==null || gi>=4) return false;
        return diasDoMes().some(function(d){
          if (indiceEquipe(d)!==gi) return false;
          const k = m.secao+"|"+m.id+"|"+fmt(d);
          return !marks[k] && !estaAfastado(m,d) && !conflito(m.id, fmt(d), m.secao);
        });
      }).length;
      if (!n){ alert("Nenhuma célula vazia para preencher."); return; }
      if (!confirm("Preencher as células vazias dos dias de serviço com X? Marcas existentes não serão alteradas.")) return;
      const criados = preencherXFaltantes();
      salvarLocal(); desenhar();
      status(criados+" X preenchido(s)");
    };
    selNovo.parentNode.insertBefore(bx, selNovo.nextSibling);

    const bxNm = document.createElement("button");
    bxNm.className = "milAction";
    bxNm.textContent = "Converter N legado → Nm (manual)";
    bxNm.title = "Ns legados (importados ou criados por afastamento) viram Nm (N manual). Nm é preservado ao remover afastamentos via ✕.";
    bxNm.onclick = function(){
      const chaves = Object.keys(marks||{}).filter(function(k){ return marks[k] === "N"; });
      if (!chaves.length){ alert("Nenhum N legado encontrado."); return; }
      if (!confirm(chaves.length + " marca(s) N serão convertidas em Nm (N manual). Elas passarão a ser preservadas ao remover afastamentos via ✕. Continuar?")) return;
      chaves.forEach(function(k){ marks[k] = "Nm"; });
      reconstruirIndiceMarcas();
      salvarLocal(); desenhar();
      status(chaves.length + " N convertidos em Nm");
    };
    selNovo.parentNode.insertBefore(bxNm, bx.nextSibling);
  }

  const t=document.createElement("table");
  t.className = "milTable";
  t.innerHTML="<thead><tr><th style='width:58px'>ORDEM</th><th>MILITAR</th><th>SEÇÃO</th>"+
    "<th>ESCALA</th><th>MOT</th><th>ADM</th><th>READAPT.</th><th>PJES ADM</th><th>AFAST. INÍCIO</th><th>AFAST. FIM</th><th>DIAS</th><th>+</th><th>INTERVALOS</th><th>OBS.</th><th>AÇÕES</th></tr></thead><tbody></tbody>";
  const tb=t.querySelector("tbody");
  const opts=(arr,cur)=>arr.map(v=>"<option value='"+v+"'"+(v===cur?" selected":"")+">"+(v||"—")+"</option>").join("");
  function opcoesEscala(m){
    if (m.adm === "S"){
      const x = escalaEmX(m);
      return "<option value='ALFA'"+(x?"":" selected")+">ADM</option>"
        + "<option value='X - A'"+(x?" selected":"")+">X-ADM</option>";
    }
    return opts(["ALFA","BRAVO","CHARLIE","DELTA","X - A","X - B","X - C","X - D"], m.escala);
  }
  const lista = D.mes.slice().sort((a,b)=>{
    const pa=D.pessoas.find(p=>p.id===a.id)||{ordem:999};
    const pb=D.pessoas.find(p=>p.id===b.id)||{ordem:999};
    return (pa.ordem||999)-(pb.ordem||999);
  });
  function motivosAfast(m){
    const arr = (m && m.afast ? m.afast : []).map(function(a){ return String(a.motivo||"").trim(); })
      .filter(function(x){ return x && x.toLowerCase() !== "manual"; });
    return Array.from(new Set(arr)).join(" · ");
  }
  lista.forEach(m=>{
    const p=D.pessoas.find(x=>x.id===m.id)||{posto:"",nome:m.id,ordem:999};
    const tr=document.createElement("tr");
    tr.classList.add("linhaMilitar");
    tr.innerHTML="<td><button class='ord' data-id='"+m.id+"' data-d='-1'>▲</button>"+
      "<button class='ord' data-id='"+m.id+"' data-d='1'>▼</button></td>"+
      "<td class='nome'>"+esc(p.posto+" "+m.id+" "+p.nome)+"</td>"+
      "<td><select class='ed' data-id='"+m.id+"' data-k='secao'>"+opts(["1ªSB","2ªSB","3ªSB","4ªSB"],m.secao)+"</select></td>"+
      "<td><select class='ed' data-id='"+m.id+"' data-k='escala' style='background:"+corEscalaExibicao(m)+";color:#333;font-weight:700;width:85px;text-align:center'>"+opcoesEscala(m)+"</select></td>"+
      "<td><select class='ed' data-id='"+m.id+"' data-k='motorista'>"+opts(["","M","B"],m.motorista||"")+"</select></td>"+
      "<td><input type='checkbox' class='edAdm' data-id='"+m.id+"'"+(m.adm==="S"?" checked":"")+"></td>"+
      "<td>"+(m.adm==="S" ? "<input type='checkbox' class='edRestr' data-id='"+m.id+"'"+(m.restricao?" checked":"")+" title='readaptado: não tira serviço'>" : "—")+"</td>"+
      "<td><input type='number' min='0' step='1' class='edCota' data-id='"+m.id+"'"+(m.adm==="S"?"":" disabled")+" style='width:54px;text-align:center"+(m.adm==="S"?"":";background:#e9ecef")+"' value='"+(m.cotasAdm||"")+"'></td>"+
      "<td><input type='date' lang='pt-BR' class='edIni' data-id='"+m.id+"' style='width:120px;font-size:11px' title='início do novo intervalo'></td>"+
      "<td><input type='date' lang='pt-BR' class='edFim' data-id='"+m.id+"' style='width:120px;font-size:11px' title='fim do novo intervalo'></td>"+
      "<td><input type='number' min='1' step='1' class='edDias' data-id='"+m.id+"' style='width:58px;text-align:center' title='dias do intervalo (inclusivo)'></td>"+
      "<td><button class='addAf' data-id='"+m.id+"' style='font-size:11px'>+</button></td>"+
      "<td style='font-size:10.5px;max-width:190px'>"+
        ((m.afast&&m.afast.length)
          ? m.afast.map(function(a,i){
              return "<span>"+dataBR(a.ini)+"→"+dataBR(fimDeAfast(a))+" <a href='#' class='rmAf' data-id='"+m.id+"' data-i='"+i+"' style='color:#842029;text-decoration:none'>✕</a></span>";
            }).join("<br>")
          : "<span style='color:#adb5bd'>—</span>")+
      "</td>"+
      "<td class='obsAf' style='font-size:10px;color:#8a6d3b'>"+esc(motivosAfast(m))+"</td>"+
      "<td><button class='rm' data-id='"+m.id+"' style='color:#842029'>remover</button></td>";
    tb.appendChild(tr);
  });
  main.appendChild(t);

  main.querySelectorAll(".ed").forEach(el=>{
    el.onchange=()=>{
      const m=D.mes.find(x=>x.id===el.dataset.id);
      if(!m) return;
      if (el.dataset.k==="escala" && AJUSTE_ESCALA_SO_MESTRE && !ehMestre()){
        alert("Somente o perfil Mestre pode alterar a escala.");
        el.value = m.escala;
        return;
      }
      if (el.dataset.k==="secao"){
        trocarSecaoMilitar(m, el.value, el);
        return;
      }
      if (el.dataset.k==="escala"){
        // ajustarEscalaMilitar já chama desenhar() em todas as saídas
        // (sucesso ou cancelamento); não precisa resetar o select aqui.
        ajustarEscalaMilitar(m, el.value);
        return;
      }
      m[el.dataset.k]=el.value;
      salvarLocal(); desenhar();
    };
  });
  function sincronizarDias(id, origem){
    const iniEl=document.querySelector(".edIni[data-id='"+id+"']");
    const fimEl=document.querySelector(".edFim[data-id='"+id+"']");
    const diasEl=document.querySelector(".edDias[data-id='"+id+"']");
    if(!iniEl||!fimEl||!diasEl) return;
    const ini=dataISO(iniEl.value), fim=dataISO(fimEl.value);
    if (origem === "dias"){
      const n=Math.max(0,Math.floor(Number(diasEl.value)||0));
      if (ini && n>0) fimEl.value=somarDiaISO(ini,n-1);
      return;
    }
    if (ini && fim && fim>=ini) diasEl.value=diasEntreISO(ini,fim);
  }
  main.querySelectorAll(".edIni,.edFim").forEach(el=>{
    const fn=function(){ sincronizarDias(el.dataset.id,"datas"); };
    el.addEventListener("input",fn); el.addEventListener("change",fn);
  });
  main.querySelectorAll(".edDias").forEach(el=>{
    const fn=function(){ sincronizarDias(el.dataset.id,"dias"); };
    el.addEventListener("input",fn); el.addEventListener("change",fn);
  });
  function addAfast(el){
    const m=D.mes.find(x=>x.id===el.dataset.id);
    if(!m) return;
    const iniEl = document.querySelector(".edIni[data-id='"+m.id+"']");
    const fimEl = document.querySelector(".edFim[data-id='"+m.id+"']");
    const diasEl = document.querySelector(".edDias[data-id='"+m.id+"']");
    let ini = dataISO(iniEl ? iniEl.value : "");
    let fim = dataISO(fimEl ? fimEl.value : "");
    const diasDigitados = Math.max(0, Math.floor(Number(diasEl ? diasEl.value : 0)||0));
    if (ini && !fim && diasDigitados > 0){
      fim = somarDiaISO(ini, diasDigitados-1);
      if (fimEl) fimEl.value = fim;
    }
    if (!ini || !fim){ alert("Informe as datas de início e término (ou início + dias)."); return; }
    if (fim < ini){ alert("Término antes do início."); return; }
    const dias = diasEntreISO(ini,fim);
    if (diasEl) diasEl.value = dias;
    m.afast = m.afast || [];
    if (m.afast.some(a=>a.ini===ini && fimDeAfast(a)===fim)){ alert("Intervalo já cadastrado."); return; }
    var novoAfast = {ini:ini, fim:fim, dias:dias, motivo:"manual", origem:"manual"};
    m.afast.push(novoAfast);
    converterParaX(m, ini, fim);
    if (statusMes === "ativa") oferecerConverterX(m.id, ini, fim);
    salvarLocal();
    propagarAfastamentoParaFuturos(m.id, novoAfast);
    desenhar(); status("intervalo adicionado");
  }
  main.querySelectorAll(".addAf").forEach(el=>{ el.onclick=()=>addAfast(el); });
  main.querySelectorAll(".rmAf").forEach(el=>{
    el.onclick=async (ev)=>{
      ev.preventDefault();
      const m=D.mes.find(x=>x.id===el.dataset.id);
      if(!m||!m.afast) return;
      const i=Number(el.dataset.i);
      const removido = m.afast[i];
      if(!removido) return;
      if(!(await modalConfirm("Remover o intervalo "+dataBR(removido.ini)+" a "+dataBR(fimDeAfast(removido))+"?", {perigo:true}))) return;
      m.afast.splice(i,1);
      // Remove também dos meses futuros já salvos (afast + escalaOrigem revertida).
      var nProp = propagarRemocaoAfastamento(m.id, removido.ini, fimDeAfast(removido));
      const dd = diasDoMes();
      const pMes = fmt(dd[0]), uMes = fmt(dd[dd.length-1]);
      const tocaMes = (m.afast||[]).some(function(a){
        const iv = intervaloISO(a);
        if (!iv.ini || !iv.fim) return false;
        return iv.fim >= pMes && iv.ini <= uMes;
      });
      const escAtual = String(m.escala||"").toUpperCase().replace(/\s+/g,"");
      const eraX = escAtual.indexOf("X-") === 0;
      let voltou = false;
      if(!tocaMes && eraX && !m.restricao){
        let origem = m.escalaOrigem;
        if (!origem) origem = MAPA_X[escAtual] || null;
        if (origem){
          m.escala = origem;
          m.escalaOrigem = null;
          voltou = true;
        }
      }
      // Recalcula marcas SEMPRE que a escala for operacional (não só quando
      // voltou de X-*). Isso cobre o caso do usuário que trocou X-A → ALFA
      // manualmente antes de remover o afastamento: os Ns oriundos do afast
      // (código "N") viram X; Nm (manual) é preservado.
      const gi = ORDEM_ESC[String(m.escala).toUpperCase().replace(/\s+/g,"")];
      if (gi != null && gi < 4 && !m.restricao){
        let apagados = 0, criados = 0, restaurados = 0;
        diasDoMes().forEach(function(d){
          if (indiceEquipe(d) !== gi) return;
          const iso = fmt(d);
          const k = m.secao+"|"+m.id+"|"+iso;
          if (estaAfastado(m, d)){
            // ainda coberto por outro afastamento: manter N (criar se vazio)
            if (marks[k] === "X"){ delete marks[k]; desindexarChave(k); }
            if (!marks[k]){ marks[k] = "N"; indexarChave(k, "N"); restaurados++; }
          } else {
            // livre: apaga N legado (afastamento) e relança X;
            // Nm (manual) é preservado.
            if (marks[k] === "N"){ delete marks[k]; desindexarChave(k); apagados++; }
            if (!marks[k] && !conflito(m.id, iso, m.secao)){
              marks[k] = "X"; indexarChave(k, "X"); criados++;
            }
          }
        });
        reconstruirIndiceMarcas();
        salvarLocal(); desenhar();
        const esc = m.escala;
        const partes = [];
        if (voltou) partes.push(esc + " restaurada");
        if (apagados) partes.push("N limpos: " + apagados);
        if (restaurados) partes.push("N restaurados: " + restaurados);
        if (criados) partes.push("X relançados: " + criados);
        if (nProp) partes.push(nProp + " mês(es) futuro(s) atualizado(s)");
        status("afastamento removido" + (partes.length ? " · " + partes.join(" · ") : ""));
        return;
      }
      salvarLocal(); desenhar();
    };
  });
  main.querySelectorAll(".edCota").forEach(el=>{
    el.onchange=()=>{
      const m=D.mes.find(x=>x.id===el.dataset.id);
      if(!m) return;
      m.cotasAdm = Math.max(0, Math.floor(Number(el.value)||0));
      salvarLocal(); desenhar();
    };
  });
  main.querySelectorAll(".edRestr").forEach(el=>{
    el.onchange=()=>{
      const m=D.mes.find(x=>x.id===el.dataset.id);
      if(!m) return;
      if (el.checked){
        const chaves = Object.keys(marks).filter(k=>{
          const p=k.split("|");
          return p[1]===m.id && (marks[k]==="X" || marks[k]==="S1" || marks[k]==="SPJ");
        });
        if (chaves.length && !confirm(chaves.length+" marcas X/S1/SPJ serão removidas. Continuar?")){
          el.checked=false; return;
        }
        chaves.forEach(k=>{ delete marks[k]; });
        m.restricao = true;
      } else {
        m.restricao = false;
      }
      salvarLocal(); desenhar();
    };
  });
  main.querySelectorAll(".edAdm").forEach(el=>{
    el.onchange=()=>{
      const m=D.mes.find(x=>x.id===el.dataset.id);
      if(!m) return;
      const nome = (D.pessoas.find(x=>x.id===m.id)||{nome:m.id}).nome;
      if (el.checked){
        // marcar ADM: remover X/PJ/PJ12 da SB; preservar N (migrando para ADM:SB); 12/24 (ACO) e host preservados
        const remover = [];
        const migrarN = [];
        Object.keys(marks||{}).forEach(k=>{
          const p = k.split("|");
          if (p[1] !== m.id) return;
          const cod = marks[k];
          if (p[0] === m.secao){
            if (cod === "N" || cod === "Nm") migrarN.push(k);
            else if (cod === "X" || cod === "PJ" || cod === "PJ12") remover.push(k);
          }
        });
        if ((remover.length || migrarN.length) && !confirm(
            "Marcar "+nome+" como ADM?\n"+
            "· Remover "+remover.length+" marca(s) X/PJ/PJ12 da "+m.secao+".\n"+
            "· N preservado ("+migrarN.length+" migrada(s) para o bloco ADM).\n"+
            "· ACO (12/24) não é afetado.\n"+
            "Continuar?"
        )){ el.checked = false; return; }
        remover.forEach(k=>{ delete marks[k]; desindexarChave(k); });
        migrarN.forEach(k=>{
          const p = k.split("|");
          const novoK = "ADM:"+m.secao+"|"+p[1]+"|"+p[2];
          const codAtual = marks[k]; // "N" ou "Nm"
          if (!marks[novoK]){ marks[novoK] = codAtual; indexarChave(novoK, codAtual); }
          delete marks[k]; desindexarChave(k);
        });
        // Normaliza escala base do ADM (ALFA) e guarda a original para restaurar ao desmarcar.
        if (m.escalaOrigemAdm === undefined) m.escalaOrigemAdm = m.escala;
        m.escala = "ALFA";
        m.adm = "S";
      } else {
        // desmarcar ADM: remover S1/SPJ/PJ/PJ12 do ADM:SB; preservar N (migrando de volta); lançar X da escala
        // Restaura a escala original (antes de marcar ADM), se houver.
        if (m.escalaOrigemAdm){
          m.escala = m.escalaOrigemAdm;
          delete m.escalaOrigemAdm;
        }
        // Se ficou X-* mas não tem afast no mês, cai para base ALFA.
        if (escalaEmX(m) && !temAfastamentoNoMes(m)){
          m.escala = MAPA_X[String(m.escala).toUpperCase().replace(/\s+/g,"")] || "ALFA";
        }
        const removerAdm = [];
        const migrarN = [];
        Object.keys(marks||{}).forEach(k=>{
          const p = k.split("|");
          if (p[1] !== m.id) return;
          if (p[0] !== "ADM:"+m.secao) return;
          const cod = marks[k];
          if (cod === "N" || cod === "Nm") migrarN.push(k);
          else if (cod === "S1" || cod === "SPJ" || cod === "PJ" || cod === "PJ12" || cod === "X") removerAdm.push(k);
        });
        const gi = ORDEM_ESC[m.escala];
        const vaiLancarX = (gi != null && gi < 4 && !m.restricao);
        if ((removerAdm.length || migrarN.length || vaiLancarX) && !confirm(
            "Desmarcar ADM de "+nome+"?\n"+
            "· Remover "+removerAdm.length+" marca(s) S1/SPJ/PJ/PJ12 do ADM.\n"+
            "· N preservado ("+migrarN.length+" migrada(s) de volta à "+m.secao+").\n"+
            (vaiLancarX ? "· X serão lançados nos dias da escala "+m.escala+".\n" : "· Sem lançamento de X (escala afastada/readaptado).\n")+
            "Continuar?"
        )){ el.checked = true; return; }
        removerAdm.forEach(k=>{ delete marks[k]; desindexarChave(k); });
        migrarN.forEach(k=>{
          const p = k.split("|");
          const novoK = m.secao+"|"+p[1]+"|"+p[2];
          const codAtual = marks[k]; // "N" ou "Nm"
          if (!marks[novoK]){ marks[novoK] = codAtual; indexarChave(novoK, codAtual); }
          delete marks[k]; desindexarChave(k);
        });
        m.adm = "";
        if (vaiLancarX){
          diasDoMes().forEach(function(d){
            if (indiceEquipe(d) !== gi) return;
            if (estaAfastado(m, d)) return;
            const iso = fmt(d);
            if (conflito(m.id, iso, m.secao)) return;
            const k = m.secao+"|"+m.id+"|"+iso;
            if (marks[k]) return;
            marks[k] = "X"; indexarChave(k, "X");
          });
        }
      }
      salvarLocal(); desenhar();
    };
  });
  main.querySelectorAll(".rm").forEach(el=>{
    el.onclick=async ()=>{
      const id=el.dataset.id;
      const p=D.pessoas.find(x=>x.id===id)||{nome:id};
      if(!(await modalConfirm("Remover "+p.nome+" do mês? As marcações dele também serão apagadas.", {perigo:true}))) return;
      const reg = D.mes.find(x=>x.id===id);
      if (reg){
        D.removidos = D.removidos || {};
        D.removidos[id] = {
          secao: reg.secao, escala: reg.escala, motorista: reg.motorista,
          adm: reg.adm, cotasAdm: reg.cotasAdm || 0, restricao: !!reg.restricao,
          afast: (reg.afast||[]).map(a=>({...a})),
          escalaOrigem: reg.escalaOrigem,
          escalaOrigemAdm: reg.escalaOrigemAdm
        };
      }
      D.mes = D.mes.filter(x=>x.id!==id);
      Object.keys(marks).forEach(k=>{ if(k.split("|")[1]===id) delete marks[k]; });
      Object.keys(vis).forEach(sb=>{ vis[sb]=(vis[sb]||[]).filter(v=>v!==id); });
      aco = aco.filter(v=>v!==id);
      salvarLocal(); desenhar(); status("removido");
    };
  });
  main.querySelectorAll(".ord").forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.id, dir=Number(el.dataset.d);
      const ordenados = D.mes.slice().sort((a,b)=>{
        const pa=D.pessoas.find(p=>p.id===a.id)||{ordem:999};
        const pb=D.pessoas.find(p=>p.id===b.id)||{ordem:999};
        return (pa.ordem||999)-(pb.ordem||999);
      });
      const i = ordenados.findIndex(x=>x.id===id), j = i+dir;
      if(i<0 || j<0 || j>=ordenados.length){ status("no limite"); return; }
      const pa=D.pessoas.find(p=>p.id===ordenados[i].id);
      const pb=D.pessoas.find(p=>p.id===ordenados[j].id);
      const tmp=pa.ordem; pa.ordem=pb.ordem; pb.ordem=tmp;
      salvarLocal(); desenhar();
    };
  });
}

// ===== 9.8 AFASTAMENTOS =====
function desenharAfastamentos(main){
  const h = document.createElement("p"); h.className="setor";
  h.textContent = "AFASTAMENTOS DO MÊS — cole a lista recebida (somente Mestre)";
  main.appendChild(h);
  if (!ehMestre()){
    const av = document.createElement("p");
    av.style.cssText="color:#8a6d3b;font-size:12.5px";
    av.textContent = "Esta aba é exclusiva do perfil Mestre.";
    main.appendChild(av); return;
  }
  const inp = document.createElement("textarea");
  inp.id = "colarAfast"; inp.className = "afTextarea";
  inp.placeholder = "Cole aqui as colunas: ITEM, Grupamento, Seção, Matrícula, Nome de guerra, Motivo, Especifique, Data de início, Data de término (datas em dd/mm/aaaa)";
  main.appendChild(inp);
  const bar = document.createElement("div");
  bar.className = "afToolbar";
  bar.innerHTML = "<button id='btnPrev'>Gerar prévia</button>"
    + "<button id='btnAplicar' disabled>Aplicar</button>"
    + "<span id='msgAf' style='font-size:12px;color:#495057'></span>";
  main.appendChild(bar);
  const alvo = document.createElement("div"); main.appendChild(alvo);

  let previa = [];

  function efeitoPadrao(esp, motivo){
    const t = String((esp||"")+" "+(motivo||"")).toUpperCase();
    if (t.indexOf("READAPT") >= 0) return "readaptado";
    if (t.indexOf("DIRIGIR") >= 0 || t.indexOf("VEICULO") >= 0 || t.indexOf("VEÍCULO") >= 0) return "direcao";
    return "afastamento";
  }
  function normMat(s){
    const d = String(s||"").replace(/[^0-9]/g,"");
    if (d.length === 7) return d.slice(0,6)+"-"+d.slice(6);
    return "";
  }
  function parseData(s){
    const t = String(s||"").trim().toUpperCase().replace(/\s+/g,"");
    if (!t) return "";
    let m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if (m){
      let y = Number(m[3]); if (y < 100) y += 2000;
      const mm = Number(m[2]), dd = Number(m[1]);
      if (!dataReal(y, mm, dd)) return "";
      return y+"-"+String(mm).padStart(2,"0")+"-"+String(dd).padStart(2,"0");
    }
    m = t.match(/^(\d{1,2})[\/\-\.]?([A-Z]{3})[\/\-\.]?(\d{2,4})$/);
    if (m){
      const mm = MESES3[m[2]]; if (!mm) return "";
      let y = Number(m[3]); if (y < 100) y += 2000;
      const dd = Number(m[1]);
      if (!dataReal(y, mm, dd)) return "";
      return y+"-"+String(mm).padStart(2,"0")+"-"+String(dd).padStart(2,"0");
    }
    return "";
  }
  function normalizarColagemAfast(txt){
    if (String(txt||"").indexOf("	") >= 0) return String(txt||"");
    const norm = function(s){ return String(s||"").trim().toUpperCase().replace(/\s+/g," "); };
    const labels = ["ITEM","GRUPAMENTO","SEÇÃO","SECAO","MATRÍCULA","MATRICULA",
      "NOME DE GUERRA","INDISPONIBILIDADE MOTIVO",'ESPECIFIQUE, CASO ESCOLHA "OUTRO"',
      "DATA DE INÍCIO","DATA DE INICIO","DATA DE TÉRMINO","DATA DE TERMINO",
      "PUBLICAÇÃO","PUBLICACAO"];
    const linhas = String(txt||"").split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
    if (!linhas.length) return "";
    const temPub = linhas.some(function(l){ const n=norm(l); return n==="PUBLICAÇÃO" || n==="PUBLICACAO"; });
    const nCampos = temPub ? 10 : 9;
    const vals = linhas.filter(function(l){ return labels.indexOf(norm(l)) < 0; });
    if (vals.length < nCampos || vals.length % nCampos !== 0) return String(txt||"");
    if (!/^\d+$/.test(vals[0])) return String(txt||"");
    const rows = [];
    for (let i=0; i<vals.length; i+=nCampos){
      if (!/^\d+$/.test(vals[i])) return String(txt||"");
      rows.push(vals.slice(i, i+nCampos).join("	"));
    }
    return rows.join("\n");
  }

  bar.querySelector("#btnPrev").onclick = function(){
    const txt = normalizarColagemAfast(inp.value || "");
    const linhas = txt.split(String.fromCharCode(10)).filter(function(l){ return l.trim(); });
    previa = [];
    const compet = String(D.competencia).slice(0,7);
    const vistos = {};
    linhas.forEach(function(l, idx){
      const c = l.split("	").map(function(x){ return String(x||"").trim(); });
      if (idx === 0 && /MATR|ITEM/i.test(l)) return;
      const mat = normMat(c[3] || c[2] || "");
      const ini = parseData(c[7] || c[6]);
      const fim = parseData(c[8] || c[7]);
      const esp = c[6] || c[5] || "";
      let st = "OK";
      const palp = D.pessoas.find(function(p){ return p.id === mat; });
      if (!mat || !palp) st = "matrícula não encontrada";
      else if (!ini || !fim) st = "data inválida";
      else if (fim < ini) st = "término antes do início";
      else if (vistos[mat+ini+fim]) st = "duplicado";
      const efPad = efeitoPadrao(esp, c[5]||"");
      const toca = (st === "OK") && !(fim.slice(0,7) < compet || ini.slice(0,7) > compet);
      if (st === "OK" && !toca && efPad !== "readaptado") st = "não toca o mês";
      if (st === "OK") vistos[mat+ini+fim] = 1;
      previa.push({linha:idx+1, mat:mat, nome:palp?palp.nome:(c[4]||"?"), ini:ini, fim:fim,
                   esp:esp, motivo:c[5]||"", st:st, toca:toca, efeito:efPad});
    });
    renderPrevia();
  };

  function renderPrevia(){
    alvo.innerHTML = "";
    if (!previa.length){ alvo.textContent = "Nada para mostrar."; return; }
    const t = document.createElement("table");
    t.className = "afPreview";
    t.innerHTML = "<thead><tr><th>#</th><th>Matrícula</th><th>Nome</th><th>Início</th><th>Fim</th>"
      + "<th>Especifique</th><th>Status</th><th>Efeito</th></tr></thead><tbody></tbody>";
    const tb = t.querySelector("tbody");
    previa.forEach(function(p, i){
      const tr = document.createElement("tr");
      tr.innerHTML = "<td>"+esc(p.linha)+"</td><td>"+esc(p.mat)+"</td><td class='nomeMilitar'>"+esc(p.nome)+"</td>"
        + "<td>"+dataBR(p.ini)+"</td><td>"+dataBR(p.fim)+"</td><td>"+esc(String(p.esp||"").slice(0,26))+"</td>"
        + "<td"+(p.st==="OK"?" class='ok'":" class='falta'")+">"+p.st+"</td>";
      const td = document.createElement("td");
      const sel = document.createElement("select");
      sel.style.fontSize = "11px";
      [["afastamento","Afastamento"],["readaptado","Readaptado"],["direcao","Restrição de direção"]].forEach(function(o){
        const op = document.createElement("option"); op.value=o[0]; op.textContent=o[1];
        if (p.efeito===o[0]) op.selected = true;
        sel.appendChild(op);
      });
      sel.onchange = function(){ previa[i].efeito = sel.value; };
      td.appendChild(sel); tr.appendChild(td);
      tb.appendChild(tr);
    });
    alvo.appendChild(t);
    bar.querySelector("#btnAplicar").disabled = false;
    bar.querySelector("#msgAf").textContent = previa.filter(function(p){ return p.st==="OK" && p.toca; }).length
      + " registro(s) aplicável(is) de " + previa.length + ".";
  }

  bar.querySelector("#btnAplicar").onclick = function(){
    const aplicar = previa.filter(function(p){
      return (p.st==="OK" && p.toca) || (p.st==="OK" && p.efeito==="readaptado");
    });
    if (!aplicar.length){ alert("Nenhum registro aplicável."); return; }
    const imp = [];
    D.mes.forEach(function(m){ if (m.afast) imp.push.apply(imp, m.afast.filter(function(a){ return a.origem==="importado"; })); });
    const chavesNovas = {};
    aplicar.forEach(function(p){ chavesNovas[p.mat+"|"+p.ini+"|"+p.fim] = 1; });
    const removidos = imp.filter(function(a){
      const mid = D.mes.find(function(x){ return (x.afast||[]).indexOf(a)>=0; });
      const id = mid ? mid.id : "";
      return !chavesNovas[id+"|"+a.ini+"|"+fimDeAfast(a)];
    });
    let msg = aplicar.length + " registro(s) serão aplicados. " + imp.length
      + " afastamento(s) importado(s) anterior(es) serão substituídos; os manuais não são tocados.";
    if (removidos.length){
      msg += String.fromCharCode(10,10) + "Serão REMOVIDOS (" + removidos.length + "):" + String.fromCharCode(10)
        + removidos.map(function(a){
            const mid = D.mes.find(function(x){ return (x.afast||[]).indexOf(a)>=0; });
            const pe = mid ? (D.pessoas.find(function(p){ return p.id===mid.id; })||{nome:mid.id}) : {nome:"?"};
            return "· " + pe.nome + " (" + (mid?mid.id:"?") + ") " + dataBR(a.ini) + "→" + dataBR(fimDeAfast(a)) + (a.motivo? " — "+a.motivo : "");
          }).join(String.fromCharCode(10));
    }
    if (!confirm(msg + String.fromCharCode(10,10) + "Continuar?")) return;
    D.mes.forEach(function(m){
      if (m.afast) m.afast = m.afast.filter(function(a){ return a.origem !== "importado"; });
    });
    let n = 0;
    const paraPropagar = [];
    aplicar.forEach(function(p){
      const m = D.mes.find(function(x){ return x.id === p.mat; });
      if (!m) return;
      if (p.efeito === "readaptado"){
        m.restricao = true; m.adm = "S";
        n++;
      } else if (p.efeito === "direcao"){
        m.afast = m.afast || [];
        if (!m.afast.some(function(a){ return a.ini===p.ini && fimDeAfast(a)===p.fim; })){
          var novoD = {ini:p.ini, fim:p.fim, motivo:p.motivo||p.esp, origem:"importado"};
          m.afast.push(novoD);
          paraPropagar.push({id:m.id, afast:novoD});
        }
        n++;
      } else {
        m.afast = m.afast || [];
        if (!m.afast.some(function(a){ return a.ini===p.ini && fimDeAfast(a)===p.fim; })){
          var novoN = {ini:p.ini, fim:p.fim, motivo:p.motivo||p.esp, origem:"importado"};
          m.afast.push(novoN);
          paraPropagar.push({id:m.id, afast:novoN});
        }
        converterParaX(m, p.ini, p.fim);
        n++;
        if (statusMes === "ativa") oferecerConverterX(m.id, p.ini, p.fim);
      }
    });
    salvarLocal();
    paraPropagar.forEach(function(x){ propagarAfastamentoParaFuturos(x.id, x.afast); });
    desenhar();
    status(n + " afastamento(s) aplicado(s)");
  };

  // painel-resumo
  const res = document.createElement("div");
  res.className = "afSummary";
  main.appendChild(res);
  const porSB = {}, porMotivo = {};
  let totalDias = 0;
  const lista = [];
  const compet = String(D.competencia).slice(0,7);
  D.mes.forEach(function(m){
    (m.afast||[]).forEach(function(a){
      const dd = diasNoMesDoIntervalo(a);
      if (!dd) return;
      totalDias += dd;
      porSB[m.secao] = (porSB[m.secao]||0)+1;
      const mo = (a.motivo||"—").slice(0,22);
      porMotivo[mo] = (porMotivo[mo]||0)+1;
      lista.push({secao:m.secao, nome:(D.pessoas.find(function(p){return p.id===m.id;})||{nome:m.id}).nome,
                  motivo:mo, ini:a.ini, fim:fimDeAfast(a), dias:dd, origem:a.origem||"manual"});
    });
    const esc = String(m.escala||"").toUpperCase().replace(/\s+/g,"");
    if (esc.indexOf("X-")===0 && !(m.afast||[]).length && !m.restricao){
      lista.push({alerta:"X-* sem afastamento: " + m.id});
    }
  });
  lista.sort(function(a,b){ return String(a.secao||"").localeCompare(String(b.secao||"")); });
  // Chips parciais/integrais por militar (dias afastados somados no mês)
  const diasPorMilitar = {};
  D.mes.forEach(function(m){
    let tot = 0;
    (m.afast||[]).forEach(function(a){ tot += diasNoMesDoIntervalo(a); });
    if (tot > 0) diasPorMilitar[m.id] = tot;
  });
  let parciaisChip = 0, integraisChip = 0;
  Object.keys(diasPorMilitar).forEach(function(id){
    if (diasPorMilitar[id] >= 20) integraisChip++;
    else parciaisChip++;
  });
  const chips = "<div style='display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 8px'>"
    + "<span style='background:#fff3cd;padding:3px 9px;border-radius:6px;font-size:11.5px' title='Militares com menos de 20 dias afastados neste mês'><b>Afastados parciais:</b> "+parciaisChip+"</span>"
    + "<span style='background:#f8d7da;padding:3px 9px;border-radius:6px;font-size:11.5px' title='Militares com 20 dias ou mais afastados neste mês'><b>Afastados integrais:</b> "+integraisChip+"</span>"
    + "</div>";
  let html = chips + "<b>Afastados do mês</b> — " + lista.filter(function(x){return x.dias;}).length
    + " registro(s)<br>"
    + "Por SB: " + Object.keys(porSB).map(function(k){ return esc(k)+" "+porSB[k]; }).join(" · ") + "<br>"
    + "Por motivo: " + Object.keys(porMotivo).map(function(k){ return esc(k)+" "+porMotivo[k]; }).join(" · ");
  res.innerHTML = "<p style='font-size:12.5px'>"+html+"</p>";
  const t2 = document.createElement("table");
  t2.className = "afSummaryTable";
  t2.innerHTML = "<thead><tr><th>SB</th><th>Militar</th><th>Motivo</th><th>Início</th><th>Fim</th><th style='min-width:150px'>No mês</th><th>Origem</th></tr></thead><tbody></tbody>";
  const tb2 = t2.querySelector("tbody");
  lista.forEach(function(x){
    const tr = document.createElement("tr");
    if (x.alerta){ tr.innerHTML = "<td colspan='7' style='color:#8a4b08'>"+x.alerta+"</td>"; }
    else tr.innerHTML = "<td>"+esc(x.secao)+"</td><td class='nomeMilitar'>"+esc(x.nome)+"</td><td>"+esc(x.motivo)+"</td><td>"+dataBR(x.ini)+"</td><td>"+dataBR(x.fim)+"</td><td class='num' style='white-space:nowrap'>"+x.dias+" dias dentro do mês</td><td>"+x.origem+"</td>";
    tb2.appendChild(tr);
  });
  res.appendChild(t2);
}

// ===== 10. AÇÕES (marcar, trocarMilitar, ajustarEscala, ...) =====
function marcar(grupo,id,dia,cod){
  if (ehPreparacao() && !abaLiberada(String(grupo).replace(/^host:/,""))){
    alert("Mês em preparação – lançamentos liberados após 'Ativar escala'.");
    return false;
  }
  if (String(grupo)==="ACO" && !podeEditarAco(id)){
    alert("Perfil "+perfilAtual+": este militar não pertence à sua SB.");
    return false;
  }
  const mm = D.mes.find(x=>x.id===id);
  const g = String(grupo);
  if (cod === "SB"){
    alert("O código SB é legado (PJES já contado na origem) e não é mais lançável.");
    return false;
  }
  if (g.indexOf("host:") === 0){
    const sb = g.slice(5);
    if (!ehMestre() && sb !== perfilAtual){
      alert("Perfil "+perfilAtual+": visitante só pode ser lançado na própria SB ("+perfilAtual+").");
      return false;
    }
    if (!mm || mm.secao === sb){
      alert("Visitante inválido: o militar é da própria SB "+sb+".");
      return false;
    }
    if (!ehMestre() && (vis[sb] || []).indexOf(id) < 0){
      alert("Visitante fora da tabela de visitantes da "+sb+". Inclua-o pela aba da SB.");
      return false;
    }
  } else if (g.indexOf("ADM:") === 0){
    const sb = g.slice(4);
    if (!ehMestre() && sb !== perfilAtual){
      alert("Perfil "+perfilAtual+": você só edita o ADM da própria SB.");
      return false;
    }
    if (!mm || mm.adm !== "S" || mm.secao !== sb){
      alert("Esta linha é do ADM da "+sb+"; o militar não é ADM dessa SB.");
      return false;
    }
  } else if (SBS.indexOf(g) >= 0){
    if (!ehMestre() && g !== perfilAtual){
      alert("Perfil "+perfilAtual+": esta aba é somente leitura.");
      return false;
    }
    if (!mm || mm.secao !== g){
      alert("Este militar não pertence à "+g+".");
      return false;
    }
  }
  if ((cod === "S1" || cod === "SPJ") && String(grupo).indexOf("ADM:")!==0){
    alert(cod + " só pode ser lançado para militar ADM.");
    return false;
  }
  if (cod !== "N" && mm && mm.afast && mm.afast.length && estaAfastado(mm, new Date(dia+"T12:00:00"))){
    alert("Militar afastado neste dia. Ajuste o afastamento na aba MILITARES.");
    return false;
  }
  const k = grupo+"|"+id+"|"+dia;
  if (!cod){ delete marks[k]; desindexarChave(k); salvarLocal(); return true; }
  const outro = conflito(id,dia,grupo);
  if (outro){
    const conflitos = [];
    Object.keys(marks||{}).forEach(function(kk){
      const pp = kk.split("|");
      if (pp[1]===id && pp[2]===dia && pp[0]!==grupo) conflitos.push(pp[0]);
    });
    const origem = !!(mm && (g===mm.secao || g==="ADM:"+mm.secao));
    const soHost = conflitos.length > 0 && conflitos.every(function(x){ return x.indexOf("host:")===0; });
    if (!(origem && soHost)){
      const br = dia.split("-").reverse().join("/"); const nome = (outro==="ADM") ? "1ª SB - ADM" : outro;
      alert("Conflito: este militar já tem serviço no dia "+br+" ("+nome+")");
      return false;
    }
  }
  const codFinal = (cod === "N") ? "Nm" : cod;
  marks[k]=codFinal;
  indexarChave(k, codFinal);
  if (mm && (g===mm.secao || g==="ADM:"+mm.secao)) expurgarHostDuplicado(id,dia);
  const inc = pjesAntesOrd(id, dia, cod);
  if (inc){
    const pe = D.pessoas.find(x=>x.id===id) || {posto:"",nome:id};
    alert("Atenção: "+((pe.posto||"")+" "+(pe.nome||id)).trim()+" ("+id+") tem PJES em "+dataBR(inc.pjes)
      +" e serviço ordinário (X) em "+dataBR(inc.x)+". Lançamento mantido.");
  }
  salvarLocal(); return true;
}

function trocarMilitar(grupo, lista, idx, novo){
  const antigo = lista[idx];
  if (!ehMestre()){
    if (grupo === "ACO"){
      if (antigo && antigo !== novo){
        const maAntigo = D.mes.find(function(x){ return x.id === antigo; });
        if (!maAntigo || maAntigo.secao !== perfilAtual){
          alert("Perfil "+perfilAtual+": só pode alterar/remover militares da sua SB no ACO.");
          return false;
        }
      }
      if (novo){
        const ma = D.mes.find(function(x){ return x.id === novo; });
        if (!ma || ma.secao !== perfilAtual){
          alert("Perfil "+perfilAtual+": no ACO você só lança militares da sua SB.");
          return false;
        }
      }
    } else if (grupo.indexOf("host:") === 0){
      const sh = grupo.slice(5);
      if (sh !== perfilAtual){
        alert("Perfil "+perfilAtual+": visitantes só na tabela da própria SB.");
        return false;
      }
    }
  }
  if (novo && grupo.indexOf("host:") === 0){
    const sh2 = grupo.slice(5);
    const mv = D.mes.find(function(x){ return x.id === novo; });
    if (mv && mv.secao === sh2){
      alert("Militar da própria SB "+sh2+" não entra como visitante.");
      return false;
    }
  }
  if (novo){
    let duplicado = false;
    if (grupo === "ACO"){
      (aco||[]).forEach((v,i)=>{ if (v===novo && i!==idx) duplicado=true; });
    } else {
      const sb = grupo.replace("host:","");
      (vis[sb]||[]).forEach((v,i)=>{ if (v===novo && i!==idx) duplicado=true; });
    }
    if (duplicado){ alert("Este militar já está lançado nesta aba."); return false; }
  }
  if (antigo && antigo!==novo){
    const chaves = Object.keys(marks).filter(k=>k.indexOf(grupo+"|"+antigo+"|")===0);
    if (chaves.length){
      if (!confirm("Este militar tem "+chaves.length+" marcas. Remover as marcas e trocar?")) return false;
      chaves.forEach(k=>{ delete marks[k]; });
    }
  }
  lista[idx] = novo || null;
  return true;
}

function trocarSecaoMilitar(reg, novaSecao, el){
  if (!reg) return;
  if (!ehMestre()){
    alert("Somente o perfil Mestre pode trocar a SB de um militar.");
    if (el) el.value = reg.secao;
    return;
  }
  if (!novaSecao || novaSecao === reg.secao){ if (el) el.value = reg.secao; return; }
  const pe = D.pessoas.find(function(p){ return p.id === reg.id; }) || {posto:"", nome:reg.id};
  const nome = ((pe.posto||"")+" "+(pe.nome||reg.id)).trim();
  const antiga = reg.secao;
  const hostNova = "host:"+novaSecao;
  const hostChaves = Object.keys(marks||{}).filter(function(k){
    var p = k.split("|");
    return p[1] === reg.id && p[0] === hostNova;
  });
  const hostAntes = hostChaves.map(function(k){ return [k, marks[k]]; });
  const visAntes = vis[novaSecao] ? vis[novaSecao].slice() : null;
  if (!confirm(nome+" ("+reg.id+"): "+antiga+" → "+novaSecao+". As marcas do mês serão movidas para a nova SB. Antiguidade mantida. "+hostChaves.length+" marca(s) "+hostNova+" serão apagadas.")){
    if (el) el.value = antiga;
    return;
  }
  // Expurgo dos vestígios de visitante no destino, depois do confirm.
  hostChaves.forEach(function(k){ delete marks[k]; });
  if (vis[novaSecao]) vis[novaSecao] = vis[novaSecao].filter(function(x){ return x !== reg.id; });

  const admAntiga = "ADM:"+antiga, admNova = "ADM:"+novaSecao;
  const chavesProprias = Object.keys(marks||{}).filter(function(k){
    var p = k.split("|");
    return p[1] === reg.id && p[0] === antiga;
  });
  const chavesAdm = reg.adm === "S" ? Object.keys(marks||{}).filter(function(k){
    var p = k.split("|");
    return p[1] === reg.id && p[0] === admAntiga;
  }) : [];
  const chavesMover = chavesProprias.concat(chavesAdm);
  const ignorados = {};
  ignorados[antiga] = 1;
  ignorados[hostNova] = 1;
  ignorados["ACO"] = 1;
  if (reg.adm === "S") ignorados[admAntiga] = 1;
  const conflitos = {};
  chavesMover.forEach(function(k){
    var p = k.split("|");
    Object.keys(marks||{}).forEach(function(k2){
      var q = k2.split("|");
      if (q[1] === reg.id && q[2] === p[2] && !ignorados[q[0]]) conflitos[p[2]] = 1;
    });
  });
  const diasConflito = Object.keys(conflitos).sort();
  if (diasConflito.length){
    // desfaz o expurgo para não deixar alteração parcial
    hostAntes.forEach(function(par){ marks[par[0]] = par[1]; });
    if (visAntes) vis[novaSecao] = visAntes;
    alert("Não foi possível mover "+nome+" ("+reg.id+"): já existe marca dele em outro grupo nas datas: "
      + diasConflito.map(dataBR).join(", ") + ". Nada foi alterado.");
    if (el) el.value = antiga;
    return;
  }
  let qtd = 0;
  chavesProprias.forEach(function(k){
    var p = k.split("|");
    marks[novaSecao+"|"+reg.id+"|"+p[2]] = marks[k];
    delete marks[k];
    qtd++;
  });
  chavesAdm.forEach(function(k){
    var p = k.split("|");
    marks[admNova+"|"+reg.id+"|"+p[2]] = marks[k];
    delete marks[k];
    qtd++;
  });
  reg.secao = novaSecao;
  reconstruirIndiceMarcas();
  D.movimentos = D.movimentos || [];
  D.movimentos.push({quando:new Date().toISOString(), tipo:"mudanca_sb",
    origem:antiga, destino:novaSecao, qtd:qtd,
    motivo:reg.id+" "+nome+" (host expurgadas: "+hostChaves.length+")"});
  salvarLocal(); desenhar();
  status("militar movido de "+antiga+" para "+novaSecao+" ("+qtd+" marca(s), "+hostChaves.length+" host expurgada(s))");
}

function ajustarEscalaMilitar(m, nova){
  if (AJUSTE_ESCALA_SO_MESTRE && !ehMestre()){
    alert("Somente o perfil Mestre pode ajustar a escala.");
    return;
  }
  if (!m || nova === m.escala) return;
  const reg = D.mes.find(function(x){ return x.id === m.id; });
  if (!reg || nova === reg.escala) return;
  const antiga = reg.escala;
  const nome = (m.p ? (m.p.posto+" "+m.p.nome).trim() : m.id);
  const rotAnt = rotuloEscala(reg);
  const rotNova = rotuloEscala({adm:reg.adm, escala:nova});
  if (reg.adm === "S"){
    if (!confirm(nome+" ("+reg.id+"): "+rotAnt+" → "+rotNova+". ADM não gera serviço automático. Nenhuma marca será alterada.")){ desenhar(); return; }
    reg.escala = nova;
    // Registra a escolha do usuário para restaurar corretamente ao desmarcar ADM.
    reg.escalaOrigemAdm = nova;
    salvarLocal(); desenhar();
    status("rótulo ADM alterado; marcas preservadas");
    return;
  }

  const grupo = reg.secao;
  const escNovaN = String(nova||"").toUpperCase().replace(/\s+/g,"");
  const giNova = ORDEM_ESC[escNovaN];
  const vaiParaOperacional = (giNova != null && giNova < 4);

  // Nunca apaga N nem Nm: Ns (afastamento e manuais) são preservados.
  // Só apaga marcas de trabalho do grupo.
  const apagar = [];
  Object.keys(marks||{}).forEach(function(k){
    var p = k.split("|");
    if (p[1] !== reg.id || p[0] !== grupo) return;
    if (marks[k] === "N" || marks[k] === "Nm") return;
    apagar.push(k);
  });

  const cont = {};
  apagar.forEach(function(k){ var v = marks[k]; cont[v] = (cont[v]||0)+1; });
  const resumo = ["X","PJ","PJ12","S1","SPJ","SB","PJ12H"].filter(function(c){ return cont[c]; })
    .map(function(c){ return c+" "+cont[c]; }).join(", ") || "nenhuma";

  const msg = nome+" ("+reg.id+"): "+rotAnt+" → "+rotNova+".\n"+
    "Marcas que serão apagadas: "+resumo+".\n"+
    "Ns e Nm (afastamentos e manuais) preservados.\n"+
    (vaiParaOperacional
      ? "X serão lançados apenas nos dias da nova escala "+nova+" sem marca e sem afastamento."
      : "Nenhum X será lançado.");
  if (!confirm(msg)){ desenhar(); return; }

  reg.escala = nova;
  if (vaiParaOperacional) reg.escalaOrigem = null;

  let apagados = 0, criados = 0;
  apagar.forEach(function(k){ delete marks[k]; desindexarChave(k); apagados++; });

  if (vaiParaOperacional && !reg.restricao){
    diasDoMes().forEach(function(d){
      if (indiceEquipe(d) !== giNova) return;
      if (estaAfastado(reg, d)) return;
      const iso = fmt(d);
      if (conflito(reg.id, iso, grupo)) return;
      const k = grupo+"|"+reg.id+"|"+iso;
      if (marks[k]) return;
      marks[k] = "X"; indexarChave(k, "X"); criados++;
    });
  }

  reconstruirIndiceMarcas();
  D.movimentos = D.movimentos || [];
  D.movimentos.push({quando:new Date().toISOString(), tipo:"ajuste_escala",
    origem:antiga, destino:nova, qtd:0, motivo:reg.id+" "+nome+" ("+resumo+")"});
  salvarLocal(); desenhar();
  status("apagadas: "+apagados+" · X lançados: "+criados);
}
