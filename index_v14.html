<script>

function invalidarCachePessoas(){
  _cachePessoasSecao = null;

function pessoasDaSecao(sec){
  if (_cachePessoasSecao && _cachePessoasSecao[sec]) return _cachePessoasSecao[sec];
  const arr = D.mes.filter(m=>m.secao===sec && m.adm!=="S")
    .map(m=>({...m, p: D.pessoas.find(p=>p.id===m.id)||{posto:"",nome:m.id}}))
    .sort((a,b)=>{
      const oa = ORDEM_ESC[a.escala] ?? 9, ob = ORDEM_ESC[b.escala] ?? 9;
      if (oa!==ob) return oa-ob;
      return (a.p.ordem||999)-(b.p.ordem||999);
    });
  if (!_cachePessoasSecao) _cachePessoasSecao = {};
  _cachePessoasSecao[sec] = arr;
  return arr;
}
function pessoasAdm(sb){
  if (_cachePessoasAdm && _cachePessoasAdm[sb]) return _cachePessoasAdm[sb];
  const arr = D.mes.filter(m=>m.adm==="S" && m.secao===sb)
    .map(m=>({...m, p: D.pessoas.find(p=>p.id===m.id)||{posto:"",nome:m.id}}))
    .sort((a,b)=>(a.p.ordem||999)-(b.p.ordem||999));
  if (!_cachePessoasAdm) _cachePessoasAdm = {};
  _cachePessoasAdm[sb] = arr;
  return arr;
}

// ===== 4. ÍNDICE DE MARCAS =====
// Índice "id|dia" -> [{k, grupo, cod}] para eliminar varreduras O(n) por célula.
// Reconstruído em salvarLocal() e em toda mutação em lote de marks.
let marksIndex = new Map();
function indexarChave(k, cod){
  const p = k.split("|");
  if (!p[1] || !p[2]) return;
  const ck = p[1] + "|" + p[2];
  let arr = marksIndex.get(ck);
  if (!arr){ arr = []; marksIndex.set(ck, arr); }
  for (let i=0;i<arr.length;i++){ if (arr[i].k === k){ arr[i].cod = cod; return; } }
  arr.push({k: k, grupo: p[0], cod: cod});
}
function desindexarChave(k){
  const p = k.split("|");
  if (!p[1] || !p[2]) return;
  const ck = p[1] + "|" + p[2];
  const arr = marksIndex.get(ck);
  if (!arr) return;
  for (let i=0;i<arr.length;i++){
    if (arr[i].k === k){ arr.splice(i, 1); break; }
  }
  if (!arr.length) marksIndex.delete(ck);
}
function reconstruirIndiceMarcas(){
  marksIndex.clear();
  Object.keys(marks||{}).forEach(function(k){ if (marks[k]) indexarChave(k, marks[k]); });
}

function marcaDoMilitarNoDia(id, dia){
  const arr = marksIndex.get(id + "|" + dia) || [];
  for (let i=0;i<arr.length;i++){
    if (arr[i].cod) return {grupo:arr[i].grupo, cod:arr[i].cod};
  }
  return null;
}

function conflito(id,dia,grupo){
  const arr = marksIndex.get(id + "|" + dia) || [];
  for (let i=0;i<arr.length;i++){
    if (arr[i].cod && arr[i].grupo !== grupo) return arr[i].grupo;
  }
  return null;
}
function markMaeDoDia(id,dia){
  const mm = D.mes.find(function(x){ return x.id===id; });
  if (!mm) return null;
  // Prioridade preservada: marca na própria SB prevalece sobre ADM:SB.
  const arr = marksIndex.get(id + "|" + dia) || [];
  let adm = null;
  for (let i=0;i<arr.length;i++){
    if (!arr[i].cod) continue;
    if (arr[i].grupo === mm.secao) return {grupo:mm.secao, cod:arr[i].cod};
    if (arr[i].grupo === "ADM:"+mm.secao && !adm) adm = {grupo:"ADM:"+mm.secao, cod:arr[i].cod};
  }
  return adm;
}
function expurgarHostDuplicado(id,dia){
  if (!markMaeDoDia(id,dia)) return 0;
  let n = 0;
  Object.keys(marks||{}).forEach(function(k){
    const p = k.split("|");
    if (p[0].indexOf("host:")===0 && p[1]===id && p[2]===dia){ delete marks[k]; desindexarChave(k); n++; }
  });
  return n;
}
function expurgarHostDuplicados(){
  let n = 0;
  Object.keys(marks||{}).forEach(function(k){
    const p = k.split("|");
    if (p[0].indexOf("host:")===0 && markMaeDoDia(p[1],p[2])){ delete marks[k]; desindexarChave(k); n++; }
  });
  return n;
}

function getMark(grupo,id,dia){
  const k0 = grupo+"|"+id+"|"+dia;
  if (marks[k0]) return marks[k0];
  const arr = marksIndex.get(id + "|" + dia) || [];
  for (let i=0;i<arr.length;i++){ if (arr[i].cod) return arr[i].cod; }
  return "";
}
function donoDaMarca(grupo,id,dia){
  const arr = marksIndex.get(id + "|" + dia) || [];
  return arr.length ? arr[0].grupo : null;
}

function getMarkExato(grupo,id,dia){ return marks[grupo+"|"+id+"|"+dia] || ""; }

function marcasDoMilitarDia(id, diaISO){
  const arr = marksIndex.get(id + "|" + diaISO) || [];
  const out = arr.filter(function(x){ return x.cod; })
                 .map(function(x){ return {grupo:x.grupo, cod:x.cod}; });
  const mm = D.mes.find(function(x){ return x.id===id; });
  if (mm && markMaeDoDia(id, diaISO)){
    return out.filter(function(x){ return x.grupo.indexOf("host:") !== 0; });
  }
  return out;
}

// Aplica um estado salvo/importado de forma única (substitui, não mescla): usado por init, carregarEstado e importar.
function aplicarEstado(j){
  invalidarCachePessoas();
  marks = (j.marks && typeof j.marks === "object") ? j.marks : {};
  comments = (j.comments && typeof j.comments === "object") ? j.comments : {};
  vis = j.vis || {}; aco = j.aco || [];
  D.visLinhas = j.visLinhas || {};
  if (j.mes) D.mes = j.mes;
  D.acoOficiais = j.acoOficiais || {};
  D.removidos = j.removidos || {};
  D.confFixos = Array.isArray(j.confFixos) ? j.confFixos : [];
  if (j.ordemPessoas && typeof j.ordemPessoas === "object"){
    D.pessoas.forEach(function(p){ if (typeof j.ordemPessoas[p.id] === "number") p.ordem = j.ordemPessoas[p.id]; });
  }
  afastMesclado = !!j.afastMesclado;
  if (j.autoX !== undefined) autoX = !!j.autoX;
  statusMes = j.statusMes || "ativa";
  D.snapshot = j.snapshot || null;
  D.movimentos = j.movimentos || [];
  if (j.params){
    D.params = {...D.params, ...j.params};
    ["metaBM","metaMot","cotas"].forEach(function(k){ if (j.params[k]) D.params[k] = {...D.params[k], ...j.params[k]}; });
  }
}

function toast(msg, tipo, ms){
  if (ms == null) ms = 2500;
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = String(msg == null ? "" : msg).toUpperCase();
  el.dataset.tipo = tipo || "info";
  el.style.opacity = "1";
  if (toast._timer) clearTimeout(toast._timer);
  toast._timer = setTimeout(function(){ el.style.opacity = "0"; }, ms);
}
// status() mantido como alias legado de toast() (compatibilidade de chamadas).
function status(t){ toast(t, (String(t||"").indexOf("ERRO") === 0) ? "erro" : "info"); }

function exportar(){
  const dados = JSON.parse(JSON.stringify({...D,...estadoSalvavel(),oficiais:D.oficiais}));
  function brAfast(lista){
    (lista||[]).forEach(function(a){
      if (!a) return;
      if (a.ini) a.ini = dataBR(a.ini);
      if (a.fim) a.fim = dataBR(a.fim);
    });

  (dados.mes||[]).forEach(function(m){ brAfast(m.afast); });
  Object.keys(dados.removidos||{}).forEach(function(id){ brAfast((dados.removidos[id]||{}).afast); });
  const blob=new Blob([JSON.stringify(dados,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="escala-"+D.competencia.slice(0,7)+".json"; a.click();
}

// Validação do arquivo a importar: formas esperadas de marks/mes/vis/aco.
function validarEstado(j){
  const erros = [];
  const CODS_VALIDOS = {};
  COD.concat(["12","24","SB","PJ12H","Nm"]).forEach(function(c){ CODS_VALIDOS[c] = 1; });
  if (j.marks !== undefined){
    if (typeof j.marks !== "object" || j.marks === null || Array.isArray(j.marks)) erros.push("marks: esperado objeto");
    else Object.keys(j.marks).forEach(function(k){
      const v = j.marks[k];
      if (typeof v !== "string") erros.push("marks["+k+"]: valor não é string");
      else if (!CODS_VALIDOS[v]) erros.push("marks["+k+"]: código desconhecido '"+v+"'");
    });
  }
  if (j.comments !== undefined){
    if (typeof j.comments !== "object" || j.comments === null || Array.isArray(j.comments)) erros.push("comments: esperado objeto");
    else Object.keys(j.comments).forEach(function(k){
      if (typeof j.comments[k] !== "string") erros.push("comments["+k+"]: esperado string");
      else if (j.comments[k].length > 2000) erros.push("comments["+k+"]: texto muito longo (max 2000)");
    });
  }
  if (j.mes !== undefined){
    if (!Array.isArray(j.mes)) erros.push("mes: esperado array");
    else j.mes.forEach(function(m, i){
      if (!m || typeof m !== "object" || Array.isArray(m)){ erros.push("mes["+i+"]: registro inválido"); return; }
      if (typeof m.id !== "string" || !m.id) erros.push("mes["+i+"]: sem id");
      if (typeof m.secao !== "string" || SBS.indexOf(m.secao) < 0) erros.push("mes["+i+"]."+(m.id||"?")+": seção inválida");
      if (typeof m.escala !== "string" || ["ALFA","BRAVO","CHARLIE","DELTA","X - A","X - B","X - C","X - D","ADM","X - ADM"].indexOf(m.escala) < 0) erros.push("mes["+i+"]."+(m.id||"?")+": escala inválida");
      var _escValidas = ["ALFA","BRAVO","CHARLIE","DELTA","X - A","X - B","X - C","X - D"];
      if (m.escalaOrigem !== undefined && m.escalaOrigem !== null && (typeof m.escalaOrigem !== "string" || _escValidas.indexOf(m.escalaOrigem) < 0)) erros.push("mes["+i+"]."+(m.id||"?")+": escalaOrigem inválida");
      if (m.escalaOrigemAdm !== undefined && m.escalaOrigemAdm !== null && (typeof m.escalaOrigemAdm !== "string" || _escValidas.indexOf(m.escalaOrigemAdm) < 0)) erros.push("mes["+i+"]."+(m.id||"?")+": escalaOrigemAdm inválida");
    });
  }
  if (j.vis !== undefined){
    if (typeof j.vis !== "object" || j.vis === null || Array.isArray(j.vis)) erros.push("vis: esperado objeto sb → array");
    else Object.keys(j.vis).forEach(function(sb){
      if (!Array.isArray(j.vis[sb])) erros.push("vis["+sb+"]: esperado array de ids");
      else j.vis[sb].forEach(function(id, i){ if (id !== null && typeof id !== "string") erros.push("vis["+sb+"]["+i+"]: id inválido"); });
    });
  }
  if (j.aco !== undefined){
    if (!Array.isArray(j.aco)) erros.push("aco: esperado array de ids/null");
    else j.aco.forEach(function(v, i){ if (v !== null && typeof v !== "string") erros.push("aco["+i+"]: id inválido"); });
  }
  const ehObj = function(o){ return o !== null && typeof o === "object" && !Array.isArray(o); };
  if (j.mes !== undefined && Array.isArray(j.mes)) j.mes.forEach(function(m, i){
    if (m && m.afast !== undefined && !Array.isArray(m.afast)) erros.push("mes["+i+"].afast: esperado array");
    else if (m && Array.isArray(m.afast)) m.afast.forEach(function(a, n){ if (!ehObj(a)) erros.push("mes["+i+"].afast["+n+"]: registro inválido"); });
  });
  if (j.params !== undefined && !ehObj(j.params)) erros.push("params: esperado objeto");
  else if (j.params){
    var P = j.params;
    ["metaBM","metaMot","cotas"].forEach(function(k){
      if (P[k] === undefined) return;
      if (!ehObj(P[k])){ erros.push("params."+k+": esperado objeto"); return; }
      Object.keys(P[k]).forEach(function(sb){
        var v = P[k][sb];
        if (v === null || v === undefined) return;
        if (typeof v !== "number" || !isFinite(v)) erros.push("params."+k+"."+sb+": esperado número");
      });
    });
    if (P.sei !== undefined && P.sei !== null){
      if (typeof P.sei !== "number" || !isFinite(P.sei) || P.sei < 0) erros.push("params.sei: esperado número >= 0");
    }
  }
  if (j.acoOficiais !== undefined && !ehObj(j.acoOficiais)) erros.push("acoOficiais: esperado objeto");
  else if (j.acoOficiais){
    Object.keys(j.acoOficiais).forEach(function(data){
      var t = j.acoOficiais[data];
      if (!ehObj(t)){ erros.push("acoOficiais["+data+"]: esperado objeto"); return; }
      ["t1","t2"].forEach(function(k){
        if (t[k] !== undefined && t[k] !== null && typeof t[k] !== "string") erros.push("acoOficiais["+data+"]."+k+": esperado string ou null");
      });
    });
  }
  if (j.removidos !== undefined && !ehObj(j.removidos)) erros.push("removidos: esperado objeto");
  else if (j.removidos){
    var _escR = ["ALFA","BRAVO","CHARLIE","DELTA","X - A","X - B","X - C","X - D"];
    Object.keys(j.removidos).forEach(function(id){
      var r = j.removidos[id];
      if (!ehObj(r)){ erros.push("removidos["+id+"]: registro inválido"); return; }
      ["escalaOrigem","escalaOrigemAdm"].forEach(function(k){
        if (r[k] !== undefined && r[k] !== null && (typeof r[k] !== "string" || _escR.indexOf(r[k]) < 0)) erros.push("removidos["+id+"]."+k+": escala inválida");
      });
    });
  }
  if (j.movimentos !== undefined){
    if (!Array.isArray(j.movimentos)) erros.push("movimentos: esperado array");
    else j.movimentos.forEach(function(x, i){
      if (!ehObj(x)){ erros.push("movimentos["+i+"]: registro inválido"); return; }
      if (typeof x.tipo !== "string" || ["remessa","transferencia","mudanca_sb","ajuste_escala"].indexOf(x.tipo) < 0) erros.push("movimentos["+i+"].tipo: inválido");
      if (typeof x.qtd !== "number" || !isFinite(x.qtd)) erros.push("movimentos["+i+"].qtd: esperado número");
      if (x.origem !== undefined && x.origem !== null && typeof x.origem !== "string") erros.push("movimentos["+i+"].origem: esperado string");
      if (x.destino !== undefined && x.destino !== null && typeof x.destino !== "string") erros.push("movimentos["+i+"].destino: esperado string");
    });
  }
  if (j.snapshot !== undefined && j.snapshot !== null && !ehObj(j.snapshot)) erros.push("snapshot: esperado objeto ou null");
  return { ok: erros.length === 0, erros: erros };
}
function importar(inp){
  if (!ehMestre()){ alert("Somente o perfil Mestre pode importar dados."); inp.value = ""; return; }
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const j=JSON.parse(r.result);
    const val = validarEstado(j);
    if (!val.ok){
      alert("Arquivo rejeitado — problemas encontrados:\n- " + val.erros.slice(0,10).join("\n- ")
        + (val.erros.length > 10 ? ("\n- ... e mais " + (val.erros.length - 10)) : ""));
      inp.value = ""; return;
    }
    if (j.competencia && j.competencia!==D.competencia){
      alert("Arquivo de outro mês ("+mesAnoBR(j.competencia)+"). Troque a competência para esse mês e importe novamente — importar aqui sobrescreveria o mês atual ("+mesAnoBR(D.competencia)+").");
      inp.value = ""; return;
    }
    if (j.autoX === undefined) j.autoX = true;
    if (!j.removidos) j.removidos = {};
    aplicarEstado(j);
    if (j.oficiais) { D.oficiais = ordenarOficiais((j.oficiais || []).concat(D.oficiais)); salvarOficiais(); }
    // Afastamentos são sempre normalizados (exportar grava datas em BR); migração de legado só em _v < 3.
    if (!(j._v >= 3)) migrarAdmSemEscala();
    normalizarAfastamentos();
    D._v = 3;
    reconstruirIndiceMarcas();
    expurgarHostDuplicados();
    limparOrfas();
    reconstruirIndiceMarcas();
    salvarLocal(true);
    desenhar();
    status("importado");
  }catch(e){ console.error("[escala7gb] importar", e); alert("arquivo invalido"); } };
  r.readAsText(f);
}

function carregarEstado(){
  D.params = {
    metaBM: Object.assign({}, D.params.metaBM),
    metaMot: Object.assign({}, D.params.metaMot),
    cotas: {},
    sei: null
  };
  let bruto = localStorage.getItem(chaveLocal());
  if (!bruto && String(D.competencia).slice(0,7)==="2026-11" && !localStorage.getItem("escala7gb-migrado")){
    const antigo = localStorage.getItem("escala7gb");
    if (antigo){
      try{
        if (!gravarMes(String(D.competencia).slice(0,7), JSON.parse(antigo))){
          throw new Error("falha ao gravar migração");
        }
        localStorage.setItem("escala7gb-migrado","1");
        bruto = antigo;
      }catch(e){ console.error("[escala7gb] migração chave antiga", e); }
    }
  }
  let msgNovoMes = "";
  if (bruto){
    try{
      const j = JSON.parse(bruto);
      autoX = false;
      aplicarEstado(j);
      if (!afastMesclado){ mesclarAfastamentosDoAnterior(); afastMesclado = true; salvarLocal(true); }
    }catch(e){ console.error("[escala7gb] estado local corrompido", e); }
  } else if (String(D.competencia).slice(0,7) === "2026-11"){
    try{ salvarLocal(true); }catch(e){ console.error("[escala7gb] salvar inicial embutido", e); }
  } else {
    marks={}; vis={}; aco=[]; afastMesclado = true; autoX = false;
    D.removidos = {}; D.visLinhas = {}; D.confFixos = []; D.acoOficiais = {};
    statusMes = "preparacao";
    D.snapshot = null; D.movimentos = [];
    const r = construirElencoNovo(ultimoElencoAnterior());
    D.mes = r.elenco;
    mesclarAfastamentosDoAnterior();
    salvarLocal(true);
    if (r.voltaram.length || r.ficaram.length){
      let msg = "";
      if (r.voltaram.length){
        const nomes = r.voltaram.map(id=>{ const p=D.pessoas.find(x=>x.id===id); return (p?p.nome:id)+" ("+id+")"; }).join(", ");
        msg += r.voltaram.length+" militar(es) X-* voltaram à escala-base: "+nomes+". ";
      }
      if (r.ficaram.length){
        msg += r.ficaram.length+" continuam X-* por afastamento. ";
      }
      msg += "Mês em PREPARAÇÃO: lance os afastamentos e ative a escala na aba OPERACIONAL.";
      msgNovoMes = msg;
    }
  }
  let _migrou = migrarAdmSemEscala();
  // PURGA DE HOST DESATIVADA.
  // Ela não altera contagem: contagemSB() já ignora visitante que tem marca na
  // própria SB (markMaeDoDia). Mas a purga fazia o estado local divergir do
  // servidor (968 x 1211) e tentava enviar 243 exclusões — recusadas para
  // perfil de SB e bloqueadas pela trava de 60 para Admin. Laço sem saída.
  // A planilha é a fonte: o que está lá permanece.
  // if (expurgarHostDuplicados()) _migrou = true;
  if (normalizarAfastamentos()) _migrou = true;
  reconstruirIndiceMarcas();
  if (limparOrfas()) _migrou = true;
  if (_migrou) { try{ salvarLocal(true); }catch(e){ console.error("[escala7gb] salvar pós-migração", e); } }
  if (msgNovoMes) alert(msgNovoMes);
  avisosLegado();
  // PARTE 3 — hook de carga do backend. Dead code enquanto Sync.ligado=false.
  if (typeof Sync !== "undefined" && Sync.ligado && typeof Sync.pullSync === "function"){
    try{
      const remoto = Sync.pullSync(String(D.competencia).slice(0,7));
      if (remoto && remoto.estado){
        aplicarOps(remoto.ops || []);
        _ultimoSync[String(D.competencia).slice(0,7)] = JSON.parse(JSON.stringify(estadoSalvavel()));
        desenhar();
      }
    }catch(e){ console.error("[escala7gb] Sync.pullSync", e); }
  }
}

function migrarRegistroAdm(m){
  if (!m) return false;

  if (SBS.indexOf(sec) < 0){
    m.secao = "1ªSB"; m.adm = "S"; mudou = true;
  }
  const esc = String(m.escala || "").toUpperCase().replace(/\s+/g,"");
  if (esc === "ADM"){
    m.escala = "ALFA"; m.adm = "S"; mudou = true;
  } else if (esc === "X-ADM"){
    m.escala = "X - A"; m.adm = "S"; mudou = true;
  }
  // Normaliza campos derivados: se inválidos, remove para não contaminar o estado.
  var _escVal = ["ALFA","BRAVO","CHARLIE","DELTA","X - A","X - B","X - C","X - D"];
  ["escalaOrigem","escalaOrigemAdm"].forEach(function(k){
    if (m[k] !== undefined && m[k] !== null && (typeof m[k] !== "string" || _escVal.indexOf(m[k]) < 0)){
      delete m[k]; mudou = true;
    }
  });
  return mudou;
}
function migrarAdmSemEscala(){

function normalizarAfastamentos(){
  let mudou = false;
  function fix(a){
    if (!a) return;
    if (a.ini){
      const ini = dataISO(a.ini);
      if (ini && ini !== a.ini){ a.ini = ini; mudou = true; }
    }
    if (a.fim){
      const fim = dataISO(a.fim);
      if (fim && fim !== a.fim){ a.fim = fim; mudou = true; }
    }
  }
  (D.mes || []).forEach(function(m){ (m.afast || []).forEach(fix); });
  Object.keys(D.removidos || {}).forEach(function(id){ ((D.removidos[id] || {}).afast || []).forEach(fix); });
  return mudou;
}
function mesesSalvos(){

function intervaloDe(a){
  var ini = new Date(String(a.ini||"").slice(0,10)+"T12:00:00");
  var fim;
  if (a.dias !== undefined && a.dias !== null && a.dias !== ""){
    fim = new Date(ini.getTime()); fim.setDate(ini.getDate()+(Number(a.dias)||0)-1);
  } else if (a.fim){
    fim = new Date(String(a.fim).slice(0,10)+"T12:00:00");
  } else {
    fim = new Date(ini.getTime()); fim.setDate(ini.getDate()-1);
  }
  return {ini:ini, fim:fim};
}
function sobrepoeMes(a, primeiro, ultimo){

function construirElencoNovo(anterior){
  var alvo = new Date(D.competencia+"T12:00:00");
  var primeiro = new Date(alvo.getFullYear(), alvo.getMonth(), 1);
  var ultimo = new Date(alvo.getFullYear(), alvo.getMonth()+1, 0);
  var voltaram = [], ficaram = [];
  var novo = (anterior||[]).map(function(mm){
    var c = JSON.parse(JSON.stringify(mm));
    migrarRegistroAdm(c);
    c.afast = (c.afast||[]).filter(function(a){ return sobrepoeMes(a, primeiro, ultimo); });
    var escN = String(c.escala||"").toUpperCase().replace(/\s+/g,"");
    if (escN.indexOf("X-")===0){
      if (c.restricao){
        ficaram.push(c.id);
      } else if (c.afast.length){
        ficaram.push(c.id);
      } else {
        if (MAPA_X[escN]) c.escala = MAPA_X[escN];
        voltaram.push(c.id);
      }
    }
    return c;
  });
  return {elenco: novo, voltaram: voltaram, ficaram: ficaram};
}

// Propaga um afastamento recém-adicionado no mês atual para os meses futuros
// já salvos, garantindo que afastamentos que atravessam a fronteira do mês

// Remove o afastamento indicado dos meses futuros já salvos e restaura
// a escalaOrigem quando o mês fica sem afastamento. Espelha o comportamento
// de propagarAfastamentoParaFuturos (que só propaga adições).
/* ==========================================================================
   FUNIL DE GRAVAÇÃO POR COMPETÊNCIA — ponto ÚNICO.
   Toda escrita de um mês passa por aqui. É o único lugar que o backend precisa
   interceptar. Nenhum outro trecho pode chamar localStorage.setItem com uma
   chave "escala7gb-AAAA-MM".
   ========================================================================== */
function chaveDeMes(ym){ return "escala7gb-" + ym; }

function lerMes(ym){
  try{
    const bruto = localStorage.getItem(chaveDeMes(ym));

}

function gravarMes(ym, j){
  if (!ym || !j) return false;
  try{
    localStorage.setItem(chaveDeMes(ym), JSON.stringify(j));
    // GANCHO DO BACKEND: enfileira só a diferença desde o último sync.
    if (typeof Sync !== "undefined" && Sync && Sync.ligado && typeof Sync.enfileirar === "function"){
      const ops = diffEstado(_ultimoSync[ym] || null, j);
      if (ops.length) Sync.enfileirar(ym, ops);
      _ultimoSync[ym] = JSON.parse(JSON.stringify(j));
    }
    return true;
  }catch(e){
    console.error("[escala7gb] gravarMes", ym, e);
    return false;
  }
}

/* ============================================================================
   F5.3 — ETAPA 5: PUSH
   Fila de operações pendentes + envio em lote. Enquanto ligado=false (file://),
   nada disso roda e o app é 100% local.
   ========================================================================== */
const Sync = {
  ligado: false,
  fila: [],
  timer: null,
  estado: "offline",     // offline | ok | enviando
  versao: null,
  recusadas: null,

  iniciar: function(){
    Sync.ligado = (Transport.disponivel() || Transport.backendDisponivel()) && !!Sessao.token;
    Sync.carregarFila();
    // fila vazia = nada pendente = sincronizado. Sem isso o indicador ficava
    // "offline" para sempre, porque o flush sai cedo quando não há o que enviar.
    if (Sync.ligado && !Sync.fila.length) Sync.estado = "ok";
    Sync.pintar();
    if (Sync.ligado){
      if (Sync.fila.length) Sync.flush();          // sobe o que ficou pendente de outra sessão
      window.addEventListener("online", function(){ Sync.flush(); });
      setInterval(function(){ if (Sync.fila.length) Sync.flush(); }, 60000);
    }
  },

  carregarFila: function(){
    try{ Sync.fila = JSON.parse(localStorage.getItem("escala7gb-fila") || "[]") || []; }
    catch(e){ Sync.fila = []; }
  },

  guardarFila: function(){
    try{ localStorage.setItem("escala7gb-fila", JSON.stringify(Sync.fila)); }catch(e){}
    Sync.pintar();
  },

  pendentes: function(){
    var n = 0;
    (Sync.fila || []).forEach(function(it){ n += (it.ops || []).length; });
    return n;
  },

  enfileirar: function(ym, ops){
    if (!Sync.ligado || !ops || !ops.length) return;
    Sync.fila.push({ ym: ym, ops: ops });
    Sync.guardarFila();
    Sync.agendar();
  },

  agendar: function(){
    if (Sync.timer) clearTimeout(Sync.timer);
    Sync.timer = setTimeout(function(){ Sync.flush(); }, 1500);
  },

  flush: async function(){
    if (!Sync.ligado || !Sync.fila.length) return;
    if (Sync.estado === "enviando") return;

    Sync.estado = "enviando"; Sync.pintar();

    var lote = Sync.fila.slice();
    Sync.fila = [];                     // otimista: esvazia e devolve se falhar

    try{
      var porMes = {};
      lote.forEach(function(it){ porMes[it.ym] = (porMes[it.ym] || []).concat(it.ops); });

      for (var ym in porMes){
        var r = await Transport.call("apiPush", [ym, porMes[ym], Sessao.token]);

        // lote inválido (recusado por regra, não por rede): DESCARTA.
        // Devolver à fila faria ele falhar para sempre, a cada abertura.
        if (r && r.fatal){
          console.error("[sync] lote descartado (", ym, "):", r.erro);
          Sync.recusadas = [{ motivo: r.erro }];
          Sync.estado = "erro";
          Sync.ultimoErro = r.erro;
          mostrarRecusas();
          continue;
        }

        if (!r || !r.ok) throw new Error((r && r.erro) || "push falhou");
        if (r.recusadas && r.recusadas.length){
          Sync.recusadas = r.recusadas;
          console.warn("[sync] recusadas:", r.recusadas);
          mostrarRecusas();
        }
        Sync.versao = r.versao;
      }
      Sync.estado = "ok";
      console.log("[sync] push ok — versao", Sync.versao);
    }catch(e){
      Sync.fila = lote.concat(Sync.fila);   // devolve tudo
      Sync.estado = "offline";
      console.error("[sync] push falhou:", e && e.message || e);
    }

    Sync.guardarFila();
  },

  /** Descarta a fila local. Use quando um lote inválido ficar preso. */
  descartarFila: function(){
    var n = Sync.pendentes();
    Sync.fila = [];
    Sync.estado = "ok";
    Sync.ultimoErro = null;
    Sync.guardarFila();
    console.warn("[sync] fila descartada (" + n + " operação(ões))");
    return n;
  },

  pintar: function(){
    var el = document.getElementById("syncStatus");
    if (!el) return;
    if (!Sync.ligado){ el.textContent = ""; return; }
    var n = Sync.pendentes();
    if (Sync.estado === "enviando"){ el.textContent = "enviando…"; el.style.color = "#ffe08a"; }
    else if (Sync.estado === "erro"){ el.textContent = "erro de envio — ver console"; el.style.color = "#ffb3b3"; }
    else if (Sync.estado === "offline"){ el.textContent = "offline" + (n ? " · " + n + " pendente(s)" : ""); el.style.color = "#ffb3b3"; }
    else if (n){ el.textContent = n + " pendente(s)"; el.style.color = "#ffe08a"; }
    else { el.textContent = "sincronizado"; el.style.color = "#b7f0c1"; }
  }
};

/* fotografia do último estado sincronizado (ou do último aplicado do servidor) */
let _ultimoSync = {};
let _tsLocal = null;

function indexarPorId(lista){
  const out = {};
  (lista || []).forEach(function(m){ if (m && m.id) out[m.id] = m; });
  return out;
}

function diffEstado(antes, depois){
  const ops = [];
  const ts = Date.now();

  // 1) marcas — por chave
  const A = (antes && antes.marks) || {}, B = (depois && depois.marks) || {};
  const chaves = new Set(Object.keys(A).concat(Object.keys(B)));
  chaves.forEach(function(k){
    const va = A[k] || "", vb = B[k] || "";
    if (va !== vb) ops.push({t:"marca", k:k, v:vb, ts:ts});
  });

  // 1b) comentários — por chave (mesmo padrão das marcas)
  const cA = (antes && antes.comments) || {}, cB = (depois && depois.comments) || {};
  new Set(Object.keys(cA).concat(Object.keys(cB))).forEach(function(k){
    const va = cA[k] || "", vb = cB[k] || "";
    if (va !== vb) ops.push({t:"comment", k:k, v:vb, ts:ts});
  });

  // 2) elenco — por militar, campo a campo
  const mA = indexarPorId((antes && antes.mes) || []);
  const mB = indexarPorId((depois && depois.mes) || []);
  new Set(Object.keys(mA).concat(Object.keys(mB))).forEach(function(id){
    const a = mA[id], b = mB[id];
    if (!a){ ops.push({t:"elenco", id:id, campos:b, ts:ts}); return; }
    if (!b){ ops.push({t:"elenco", id:id, campos:null, ts:ts}); return; }
    const campos = {};
    ["secao","escala","motorista","adm","restricao","cotasAdm",
     "afast","escalaOrigem","escalaOrigemAdm","motoristaEra","motoristaVolta"]
      .forEach(function(campo){
        if (JSON.stringify(a[campo]) !== JSON.stringify(b[campo])) campos[campo] = b[campo];
      });
    if (Object.keys(campos).length) ops.push({t:"elenco", id:id, campos:campos, ts:ts});
  });

  // 3) oficiais do ACO — por dia/turno
  const oA = (antes && antes.acoOficiais) || {}, oB = (depois && depois.acoOficiais) || {};
  new Set(Object.keys(oA).concat(Object.keys(oB))).forEach(function(dia){
    ["t1","t2"].forEach(function(turno){
      const va = (oA[dia]||{})[turno] || "", vb = (oB[dia]||{})[turno] || "";
      if (va !== vb) ops.push({t:"oficial", dia:dia, turno:turno, v:vb, ts:ts});
    });
  });

  // 4) movimentos — append-only, identifica por assinatura
  const idMov = function(m){ return [m.quando,m.tipo,m.origem,m.destino,m.qtd].join("|"); };
  const movA = new Set(((antes && antes.movimentos) || []).map(idMov));
  ((depois && depois.movimentos) || []).forEach(function(m){
    if (!movA.has(idMov(m))) ops.push({t:"mov", id:idMov(m), dados:m, ts:ts});
  });

  // 5a) VISITANTES — por SB, para o escalante da própria SB poder gravar.
  // visLinhas (altura do bloco) vai junto: é dado da mesma SB e não pode
  // depender de "meta", que só Admin/Mestre gravam.
  const visA = (antes && antes.vis) || {}, visB = (depois && depois.vis) || {};
  const vlA = (antes && antes.visLinhas) || {}, vlB = (depois && depois.visLinhas) || {};
  new Set(Object.keys(visA).concat(Object.keys(visB), Object.keys(vlA), Object.keys(vlB))).forEach(function(sb){
    const la = (visA[sb] || []).join(",");
    const lb = (visB[sb] || []).join(",");
    const qa = vlA[sb], qb = vlB[sb];
    if (la !== lb || qa !== qb){
      ops.push({ t: "vis", sb: sb, lista: visB[sb] || [], linhas: qb, ts: ts });
    }
  });

  // 5c) ACO — lista de militares em 12/24. Operação própria: o escalante
  // inclui/remove os militares da sua seção; o servidor confere pelo elenco.
  // linhas vazias da ACO (id null/"") nao viram operacao
  const acoA = ((antes && antes.aco) || []).filter(function(x){ return !!x; });
  const acoB = ((depois && depois.aco) || []).filter(function(x){ return !!x; });
  const acoAdd = acoB.filter(function(id){ return acoA.indexOf(id) < 0; });
  const acoDel = acoA.filter(function(id){ return acoB.indexOf(id) < 0; });
  if (acoAdd.length || acoDel.length){
    ops.push({ t: "aco", add: acoAdd, del: acoDel, ts: ts });
  }

  // 5d) ELENCO — o servidor precisa do cadastro para autorizar ACO por SB.
  // Cada perfil envia só as seções que pode gravar (a sua, ou todas se global).
  const elA = {}, elB = {};
  ((antes && antes.mes) || []).forEach(function(m){ elA[m.id] = m; });
  ((depois && depois.mes) || []).forEach(function(m){ elB[m.id] = m; });
  const CAMPOS_EL = ["secao","escala","adm","motorista","restricao","cotasAdm","escalaOrigem","escalaOrigemAdm","afast"];
  const _global = ehMestre();
  const _meu = String(perfilAtual || "");
  Object.keys(elB).forEach(function(id){
    const a = elA[id], b = elB[id];
    if (!_global && String(b.secao) !== _meu) return;   // não é minha seção
    const campos = {};
    let mudou = false;
    CAMPOS_EL.forEach(function(c){
      const va = JSON.stringify(a ? (a[c] === undefined ? null : a[c]) : null);
      const vb = JSON.stringify(b[c] === undefined ? null : b[c]);
      if (va !== vb){ campos[c] = b[c] === undefined ? null : b[c]; mudou = true; }
    });
    if (mudou) ops.push({ t: "elenco", id: id, campos: campos, ts: ts });
  });

  // 5d) metadados (vis e visLinhas NÃO entram aqui: têm operação própria)
  const metaCampos = ["statusMes","autoX","snapshot","params","afastMesclado",
                      "confFixos","removidos","ordemPessoas"];
  const camposMeta = {};
  metaCampos.forEach(function(c){
    if (JSON.stringify(antes ? antes[c] : undefined) !== JSON.stringify(depois[c])) camposMeta[c] = depois[c];
  });
  if (Object.keys(camposMeta).length) ops.push({t:"meta", campos:camposMeta, ts:ts});

  return ops;
}

function aplicarOps(ops){
  if (!ops || !ops.length) return 0;
  let n = 0;
  (_tsLocal = _tsLocal || {});
  ops.forEach(function(op){
    const marcaTs = op.k ? (op.t + ":" + op.k)
                 : op.t === "oficial" ? ("oficial:" + op.dia + ":" + op.turno)
                 : (op.t + ":" + (op.id || op.dia || "meta"));
    if (_tsLocal[marcaTs] && _tsLocal[marcaTs] >= op.ts) return;
    if (op.t === "marca"){
      if (op.v) marks[op.k] = op.v; else delete marks[op.k];
    } else if (op.t === "elenco"){
      const m = D.mes.find(function(x){ return x.id === op.id; });
      if (op.campos === null){ D.mes = D.mes.filter(function(x){ return x.id !== op.id; }); }
      else if (m) Object.assign(m, op.campos);
      else D.mes.push(Object.assign({id:op.id}, op.campos));
    } else if (op.t === "comment"){
      if (op.v) comments[op.k] = op.v; else delete comments[op.k];
    } else if (op.t === "oficial"){
      D.acoOficiais[op.dia] = D.acoOficiais[op.dia] || {t1:"",t2:""};
      D.acoOficiais[op.dia][op.turno] = op.v;
    } else if (op.t === "mov"){
      D.movimentos = D.movimentos || [];
      const idMov = function(m){ return [m.quando,m.tipo,m.origem,m.destino,m.qtd].join("|"); };
      if (!D.movimentos.some(function(m){ return idMov(m) === op.id; })) D.movimentos.push(op.dados);
    } else if (op.t === "meta"){
      Object.keys(op.campos).forEach(function(c){ D[c] = op.campos[c]; });
    } else if (op.t === "aco"){
      let lista = (aco || []).slice();
      (op.add || []).forEach(function(id){ if (lista.indexOf(id) < 0) lista.push(id); });
      (op.del || []).forEach(function(id){ lista = lista.filter(function(x){ return x !== id; }); });
      aco = lista;
    } else if (op.t === "vis"){
      vis = vis || {};
      vis[op.sb] = op.lista || [];
      if (op.linhas != null){
        D.visLinhas = D.visLinhas || {};
        D.visLinhas[op.sb] = op.linhas;
      }
    }
    _tsLocal[marcaTs] = op.ts;
    n++;
  });
  reconstruirIndiceMarcas();
  return n;
}

function propagarRemocaoAfastamento(id, ini, fim){
  if (!id || !ini || !fim) return 0;
  var atual = String(D.competencia).slice(0,7);
  var mesesFuturos = mesesSalvos().filter(function(ym){
    return ym > atual && /^\d{4}-\d{2}$/.test(ym);
  });
  var n = 0;
  mesesFuturos.forEach(function(ym){
    var j = lerMes(ym);
    if (!j) return;
    try{
      if (!j.mes) return;
      var m = j.mes.find(function(x){ return x.id === id; });
      if (!m || !m.afast) return;
      var antes = m.afast.length;
      m.afast = m.afast.filter(function(a){
        var iv = intervaloISO(a);
        return !(iv.ini === ini && iv.fim === fim);
      });
      if (m.afast.length === antes) return;
      if (!m.afast.length && m.escalaOrigem && String(m.escala).toUpperCase().replace(/\s+/g,"").indexOf("X-") === 0 && !m.restricao){
        m.escala = m.escalaOrigem;
        m.escalaOrigem = null;
      }
      gravarMes(ym, j);
      n++;
    }catch(e){ console.error("[escala7gb] propagarRemocaoAfastamento", ym, e); }
  });
  return n;
}
function propagarAfastamentoParaFuturos(id, afast){
  if (!id || !afast) return;
  var atual = String(D.competencia).slice(0,7);
  var mesesFuturos = mesesSalvos().filter(function(ym){
    return ym > atual && /^\d{4}-\d{2}$/.test(ym);
  });
  mesesFuturos.forEach(function(ym){
    var j = lerMes(ym);
    if (!j) return;
    try{
      if (!j.mes) return;
      var alvo = new Date(ym+"-01T12:00:00");
      var primeiro = new Date(alvo.getFullYear(), alvo.getMonth(), 1);
      var ultimo = new Date(alvo.getFullYear(), alvo.getMonth()+1, 0);
      if (!sobrepoeMes(afast, primeiro, ultimo)) return;
      var m = j.mes.find(function(x){ return x.id === id; });
      if (!m) return;
      m.afast = m.afast || [];
      var jaTem = m.afast.some(function(b){ return b.ini === afast.ini && fimDeAfast(b) === fimDeAfast(afast); });
      if (jaTem) return;
      m.afast.push(JSON.parse(JSON.stringify(afast)));
      var esc = String(m.escala||"").toUpperCase().replace(/\s+/g,"");
      if (m.adm !== "S" && ORDEM_ESC[esc] != null && ORDEM_ESC[esc] < 4 && !m.restricao){
        m.escalaOrigem = m.escalaOrigem || m.escala;
        m.escala = "X - " + ["A","B","C","D"][ORDEM_ESC[esc]];
      }
      gravarMes(ym, j);
    }catch(e){ console.error("[escala7gb] propagarAfastamentoParaFuturos", ym, e); }
  });
}


const PJ_ANTES_ORD_DIAS = 1;

function pjesAntesOrd(id, dia, cod){

}

function pesoMeta(v){ if(v==="X"||v==="PJ"||v==="SPJ") return 1;

function contagemSB(sb,d){

function motoristasSB(sb,d){

  [...new Set(vis[sb]||[])].forEach(id=>{

  });
  if (!_cacheMotoristasSB) _cacheMotoristasSB = {};
  if (!_cacheMotoristasSB[sb]) _cacheMotoristasSB[sb] = {};
  _cacheMotoristasSB[sb][dd] = n;
  return n;
}

function cotasDoCodigo(v){
  if (v==="PJ") return 2;
  if (v==="PJ12"||v==="PJ12H"||v==="SPJ") return 1;

}
function somarCotas(prefixos){
  let s=0;
  for (const k in marks){
    const p=k.split("|");
    if (!prefixos.some(pre=> p[0]===pre)) continue;
    if (markMaeDoDia(p[1], p[2]) && p[0].indexOf("host:")===0) continue;
    s += cotasDoCodigo(marks[k]);
  }

}


function limparOrfas(){
  let mudou = false;
  // duplicados dentro da mesma SB (entre SBs o mesmo visitante pode constar na
  // lista sem ter marca; apagar por causa disso perderia marcas da planilha)
  Object.keys(vis||{}).forEach(sb=>{
    const arr = [...new Set(vis[sb]||[])];
    if (arr.length !== (vis[sb]||[]).length) mudou = true;
    vis[sb] = arr;
  });
  // duplicados em aco
  const vistosAco = {};
  const acoNovo = [];
  (aco||[]).forEach(id=>{
    if (!id) { acoNovo.push(id); return; }
    if (vistosAco[id]) { mudou = true; return; }
    vistosAco[id] = 1; acoNovo.push(id);
  });
  if (acoNovo.length !== (aco||[]).length) mudou = true;
  aco = acoNovo;
  // marcas órfãs: NÃO são apagadas automaticamente.
  // Apagar com base em 'vis' destrói dado real quando a lista está vazia ou
  // incompleta (foi assim que 243 marcas de visitante se perderam). Quem quiser
  // remover marca de visitante apaga a marca, não a lista.
  if (mudou) reconstruirIndiceMarcas();
  return mudou;
}
// Unificação dos dois geradores de X em uma única definição.
// preencherXFaltantes({respeitarAutoX:true}) preserva o contrato do gerador antigo:
// retorna 0 se autoX já estiver true; caso contrário gera os X e seta autoX = true.
function preencherXFaltantes(opts){
  const respeitarAutoX = !!(opts && opts.respeitarAutoX);
  if (respeitarAutoX && autoX) return 0;
  let criados = 0;
  D.mes.forEach(function(m){
    if (m.adm==="S" || m.restricao) return;
    const gi = ORDEM_ESC[String(m.escala||"").toUpperCase().replace(/\s+/g,"")];
    if (gi==null || gi>=4) return;
    diasDoMes().forEach(function(d){
      if (indiceEquipe(d)!==gi) return;
      const iso = fmt(d);
      if (estaAfastado(m, d)) return;
      const k = m.secao+"|"+m.id+"|"+iso;
      if (marks[k]) return;
      if (conflito(m.id, iso, m.secao)) return;
      marks[k] = "X";
      criados++;
    });
  });
  if (respeitarAutoX) autoX = true;
  reconstruirIndiceMarcas();
  return criados;
}

function fimDeAfast(a){
  if (!a) return "";
  if (a.fim) return String(a.fim).slice(0,10);
  if (a.dias != null && a.ini){
    const d = new Date(a.ini + "T12:00:00");
    d.setDate(d.getDate() + (Number(a.dias)||0) - 1);
    return fmt(d);
  }
  return a.ini ? String(a.ini).slice(0,10) : "";
}
function intervaloISO(a){
  const ini = String(a.ini||"").slice(0,10);
  const fim = fimDeAfast(a);
  return {ini:ini, fim:fim};
}
function diasNoMesDoIntervalo(a){
  // O(1): interseção [ini,fim] ∩ [1º,último] do mês, em UTC (sem DST).
  // Semântica idêntica à versão iterativa (contagem inclusiva).
  const alvo = String(D.competencia).slice(0,7);
  const {ini, fim} = intervaloISO(a);
  if (!ini || !fim) return 0;
  const yi = Number(ini.slice(0,4)), mi = Number(ini.slice(5,7)), di = Number(ini.slice(8,10));
  const yf = Number(fim.slice(0,4)), mf = Number(fim.slice(5,7)), df = Number(fim.slice(8,10));
  const ya = Number(alvo.slice(0,4)), ma = Number(alvo.slice(5,7));
  if (!yi || !mi || !di || !yf || !mf || !df || !ya || !ma) return 0;
  const iniU = Date.UTC(yi, mi-1, di);
  const fimU = Date.UTC(yf, mf-1, df);
  const pU   = Date.UTC(ya, ma-1, 1);
  const uU   = Date.UTC(ya, ma, 0); // dia 0 do mês seguinte = último dia do mês alvo
  const start = Math.max(iniU, pU);
  const end   = Math.min(fimU, uU);
  if (end < start) return 0;
  return Math.round((end - start) / 86400000) + 1;
}
function marcasNoIntervalo(id, ini, fim){
  const out = [];
  Object.keys(marks||{}).forEach(function(k){
    const p = k.split("|");
    if (p[1] !== id) return;
    if (p[2] >= ini && p[2] <= fim) out.push(k);
  });
  return out;
}
// Regra central "ADM/afastado → escala vira X-*" (preserva escalaOrigem).
function converterParaX(reg, ini, fim){
  const esc = String(reg.escala||"").toUpperCase().replace(/\s+/g,"");
  if (reg.adm === "S" || ORDEM_ESC[esc] == null || ORDEM_ESC[esc] >= 4) return false;
  if (reg.restricao) return false;
  reg.escalaOrigem = reg.escalaOrigem || reg.escala;
  reg.escala = "X - " + ["A","B","C","D"][ORDEM_ESC[esc]];
  return true;
}
function oferecerConverterX(id, ini, fim){
  if (statusMes !== "ativa") return;
  const dentro = marcasNoIntervalo(id, ini, fim);
  const xs = dentro.filter(function(k){ return marks[k]==="X"; });
  const outros = dentro.filter(function(k){ return marks[k]!=="X"; });
  const pe = D.pessoas.find(function(p){ return p.id === id; }) || {posto:"", nome:id};
  const nome = ((pe.posto||"")+" "+(pe.nome||id)).trim()+" ("+id+")";
  const dias = xs.map(function(k){ return dataBR(k.split("|")[2]).slice(0,5); });
  const diasTxt = dias.slice(0,8).join(", ") + (dias.length > 8 ? ", …" : "");
  const outTxt = outros.slice(0,8).map(function(k){ return dataBR(k.split("|")[2]).slice(0,5)+"="+marks[k]; }).join(", ")
    + (outros.length > 8 ? ", …" : "");
  let msg = nome + " — afastamento de " + dataBR(ini) + " a " + dataBR(fim) + String.fromCharCode(10);
  if (xs.length) msg += xs.length + " marca(s) X caem nesse afastamento (dias: " + diasTxt + ")." + String.fromCharCode(10);
  if (outros.length) msg += outros.length + " outra(s) marca(s) (PJ/PJ12/SPJ/S1) NÃO serão alteradas: " + outTxt + String.fromCharCode(10);
  if (!xs.length){ if (outros.length) alert(msg.trim()); return; }
  if (!confirm(msg + String.fromCharCode(10) + "Converter essas marcas X em N?")) return;
  xs.forEach(function(k){ marks[k] = "N"; });
}
function estaAfastado(m, dia){  const alvo = fmt(dia);
  const lista = (m && m.afast) ? m.afast : [];
  for (let i=0;i<lista.length;i++){
    const {ini, fim} = intervaloISO(lista[i]);
    if (!ini || !fim) continue;
    if (alvo >= ini && alvo <= fim) return true;
  }
  return false;
}
function diasAfastados(m){
  const dias = diasDoMes();
  const esc = String((m && m.escala) || "").toUpperCase().replace(/\s+/g,"");
  // X-* guarda a equipe base em escalaOrigem (ou em MAPA_X): sem isso, o
  // afastamento de um militar X-* conta todos os dias, não só os da equipe.
  const isX = esc.indexOf("X-") === 0;
  const escalaBase = isX ? (m.escalaOrigem || MAPA_X[esc] || esc) : esc;
  const gi = ORDEM_ESC[String(escalaBase||"").trim().toUpperCase().replace(/\s+/g,"")];
  const ehEquipe = (gi!=null && gi<4);
  const ehDiaServico = (d)=> ehEquipe ? (indiceEquipe(d)===gi) : true;
  let n=0;
  dias.forEach(d=>{ if (ehDiaServico(d) && estaAfastado(m,d)) n++; });
  // X-* sem afastamento no mês corrente = afastado o mês inteiro (semântica
  // histórica). Só dispara o fallback se NÃO houver afast — nunca quando o
  // afast existe mas não cobre dias de serviço da equipe base.
  if (n===0 && isX && !temAfastamentoNoMes(m)) n = dias.filter(ehDiaServico).length;
  return n;
}
function saldosDevidos(m){
  if (m && m.restricao) return 0;
  let a = 0;
  diasDoMes().forEach(d=>{ if (estaAfastado(m, d)) a++; });
  const esc = String((m && m.escala) || "").toUpperCase().replace(/\s+/g,"");
  if (a === 0 && esc.indexOf("X-") === 0 && (!m.afast || !m.afast.length)) a = 30;
  if (a > 30) a = 30;
  return Math.floor((4 * (30 - a) + 29) / 30);
}

function avisosLegadoDados(){
  const out = [];
  Object.keys(marks||{}).forEach(function(k){
    const p = k.split("|");
    const cod = marks[k];
    if (cod !== "PJ12H" && cod !== "SPJ" && cod !== "SB") return;
    if (cod === "SPJ" && String(p[0]).indexOf("ADM:") === 0) return;
    const pe = D.pessoas.find(function(x){ return x.id === p[1]; }) || {nome:p[1]};
    out.push({grupo:p[0], id:p[1], nome:pe.nome, dia:p[2], cod:cod});
  });
  return out;
}

   por turno e cota destinada) passa por podeEditarAco() ou ehMestre().

function ehMestre(){ return perfilAtual === "Mestre" || perfilAtual === "Admin"; }
function podeEditarAco(id){
  if (ehMestre()) return true;

                       x && x.ok ? "#d9ead3" : "#f8d7da");

// Cabeçalhos com várias linhas no <thead> empilham (top acumulado) em vez de se sobrepor.
function ajustarStickyThead(){
  const base = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hdr-h")) || 50;
  document.querySelectorAll("thead").forEach(function(th){
    const linhas = th.querySelectorAll("tr");
    if (linhas.length < 2) return;
    let topo = base;
    linhas.forEach(function(tr){
      tr.querySelectorAll("th").forEach(function(c){ c.style.top = topo + "px"; });
      topo += tr.getBoundingClientRect().height;
    });
  });
}
window.addEventListener("resize", function(){ ajustarStickyThead(); });

function abrirMenuCodigos(ancora, codigos, cb){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  [""].concat(codigos).forEach(c=>{
    const b = document.createElement("button");
    b.textContent = c===""?"limpar":c;
    b.onclick = ()=>{ menu.style.display="none"; cb(c); };
    menu.appendChild(b);
  });
  menu.style.display = "grid";
  const r = ancora.getBoundingClientRect();
  menu.style.left = Math.max(0, Math.min(r.left, window.innerWidth-330))+"px";
  menu.style.top = (r.bottom + 4)+"px";
  // Se o menu estourar a janela embaixo, abre acima da célula (medido após inserir os botões).
  requestAnimationFrame(function(){
    const mh = menu.offsetHeight || 0;
    if (r.bottom + mh > window.innerHeight){
      menu.style.top = Math.max(0, (r.top - mh - 4)) + "px";
    }
  });
}

function anexarBuscaMilitar(sel){
  if (!sel || sel.dataset.buscaMilitar === "1") return;
  sel.dataset.buscaMilitar = "1";
  const opts = Array.prototype.map.call(sel.options, function(o){
    return {value:o.value, text:o.textContent, disabled:o.disabled};
  });
  let buffer = "", timer = null;
  function rebuild(q){
    q = buscaNorm(q);
    const atual = sel.value;
    sel.innerHTML = "";
    opts.forEach(function(o){
      if (!q || !o.value || o.value === atual || buscaNorm(o.text).indexOf(q) >= 0){
        const op = document.createElement("option");
        op.value = o.value; op.textContent = o.text; op.disabled = o.disabled;
        sel.appendChild(op);
      }
    });
    sel.value = atual;
  }
  function reset(){
    buffer = ""; clearTimeout(timer); timer = null; rebuild("");
  }
  sel.title = (sel.title ? sel.title+" · " : "") + "Digite para filtrar por nome, matrícula ou posto";
  sel.setAttribute("aria-label","Lista de militares; digite para filtrar");
  sel.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ e.preventDefault(); reset(); return; }
    if (e.key === "Backspace"){ e.preventDefault(); buffer = buffer.slice(0,-1); rebuild(buffer); return; }
    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){
      e.preventDefault();
      buffer += e.key;
      clearTimeout(timer);
      timer = setTimeout(reset, 1600);
      rebuild(buffer);
    }
  });
  sel.addEventListener("blur", reset);
}

}

// ===== 9. RENDER: ABAS =====
// ===== 9.1 SB (desenharGrade2) =====
function desenharGrade2(main, sb){
  const dias = diasDoMes();
  const NCOL = 5 + dias.length + 2;
  vis[sb] = vis[sb] || [];
  Object.keys(marks||{}).forEach(function(k){
    const p = k.split("|");
    if (p[0] === "host:"+sb && p[1] && vis[sb].indexOf(p[1]) < 0) vis[sb].push(p[1]);
  });
  const t = document.createElement("table");
  t.className = "gradeSb";
  const cg = document.createElement("colgroup");
  [34,60,60,200,30].forEach(function(w){ const c=document.createElement("col"); c.style.width=w+"px"; cg.appendChild(c); });
  dias.forEach(function(){ cg.appendChild(document.createElement("col")); });
  [54,54].forEach(function(w){ const c=document.createElement("col"); c.style.width=w+"px"; cg.appendChild(c); });
  t.appendChild(cg);
  let fem = D.fem || {};
  if (!podeEditarSB(sb)){
    const av = document.createElement("p");
    av.style.cssText = "font-size:12px;color:#8a6d3b;margin:0 0 8px";
    av.textContent = "Perfil "+perfilAtual+" — a "+sb+" é somente leitura. Edite apenas a sua SB.";
    main.appendChild(av);
  }
  if ((!AJUSTE_ESCALA_SO_MESTRE || ehMestre())) montarPainelAjuste(main, sb);

  function cabecalhoBloco(titulo, rotOrd){
    const tr1 = document.createElement("tr");
    tr1.className = "tit";
    const th1 = document.createElement("th");
    th1.colSpan = NCOL;
    th1.textContent = titulo;
    th1.style.background = "#1f3864";
    th1.style.textAlign = "left";
    th1.style.padding = "4px 8px";
    tr1.appendChild(th1);
    t.appendChild(tr1);

    const tr2 = document.createElement("tr");
    tr2.className = "cab";
    ["Nº","ESCALA","MOT","MILITAR","F"].forEach(h=>{
      const th=document.createElement("th"); th.textContent=h;
      if (h === "F") th.className = "colF";
      tr2.appendChild(th);
    });
    dias.forEach(d=>{
      const th=document.createElement("th");
      const c=corDia(d);
      if (c) th.style.color = ehFds(d) ? "#ffb3a7" : c;
      th.textContent=String(d.getDate()).padStart(2,"0");
      tr2.appendChild(th);
    });
    [rotOrd||"ORD","PJES"].forEach(h=>{
      const th=document.createElement("th"); th.textContent=h; tr2.appendChild(th);
    });
    t.appendChild(tr2);
  }

  function linhaPessoa(m, grupo, num, ehAdm){
    const tr=document.createElement("tr");
    tr.className="g"+(ehAdm ? 4 : indiceCorEscala(m.escala))+" linhaMilitar";
    tr.dataset.militarId = m.id;
    const tdN=document.createElement("td"); tdN.className="num"; tdN.textContent=num; tr.appendChild(tdN);
    const tdE=document.createElement("td"); tdE.className="escala"; tdE.textContent=(m.adm==="S" ? rotuloEscala(m) : m.escala); tdE.style.background=corEscalaExibicao(m); tr.appendChild(tdE);
    const tdM=document.createElement("td"); tdM.className="mot"; tdM.textContent=m.motorista||""; tr.appendChild(tdM);
    const tdP=document.createElement("td"); tdP.className="nome"; tdP.textContent=nomeCompleto(m.p); tr.appendChild(tdP);
    const tdF=document.createElement("td");
    tdF.className="num colF";
    tdF.style.fontWeight = fem[m.id] ? "700" : "400";
    tdF.textContent = fem[m.id]?"F":"";
    tr.appendChild(tdF);
    let ord=0, cot=0, sal=0;
    dias.forEach(d=>{
      const td=document.createElement("td");
      td.dataset.dia = fmt(d);
      if (estaAfastado(m, d)){
        td.className="dia"; td.textContent="N"; pintar(td, "N", m.escala);
        td.dataset.cmtKey = grupo + "|" + m.id + "|" + fmt(d);
        tr.appendChild(td); return;
      }
      celulaMarca(td, grupo, m.id, fmt(d), m.escala, ()=>desenhar(), ehAdm);
      if (td.dataset.semContagem === "1"){ tr.appendChild(td); return; }
      const v=getMarkExato(grupo, m.id, fmt(d));
      if (v==="X") { ord++; sal+=2; }
      if (v==="S1") sal+=1;
      if (v==="SPJ") sal+=1;
      if (v==="PJ") cot+=2;
      if (v==="PJ12"||v==="PJ12H"||v==="SPJ") cot+=1;
      tr.appendChild(td);
    });
    const tdO=document.createElement("td"); tdO.className="num";
    let ideal=null;
    if (ehAdm) ideal = saldosDevidos(m);
    else {
      // X-* guarda a equipe base em escalaOrigem (ou em MAPA_X): sem isso, o
      // militar operacional afastado fica sem "devidos" na coluna ORD.
      const escN = String(m.escala||"").toUpperCase().replace(/\s+/g,"");
      const isX  = escN.indexOf("X-") === 0;
      const escalaBase = isX ? (m.escalaOrigem || MAPA_X[escN] || m.escala) : m.escala;
      const gi = ORDEM_ESC[escalaBase];
      if (gi != null && gi < 4){
        const diasServico      = dias.filter(d => indiceEquipe(d) === gi).length;
        const diasAfastServico = dias.filter(d => indiceEquipe(d) === gi && estaAfastado(m, d)).length;
        ideal = Math.max(0, diasServico - diasAfastServico);
      }
    }
    const atingiu = ehAdm ? sal : ord;
    const readaptado = ehAdm && m.restricao;
    if (readaptado){
      tdO.textContent = "—";
      tdO.title = "readaptado: não é cobrado";
    } else {
      tdO.textContent = (ideal!=null) ? (atingiu||0)+"/"+ideal : (atingiu||"");
      if (ideal!=null){
        if (ehAdm){
          if (ideal === 0){ tdO.title = "sem saldos devidos"; }
          else if (atingiu >= ideal){ tdO.style.background="#d9ead3"; tdO.style.color="#14532d"; tdO.style.fontWeight="700"; tdO.title="cumprido ("+atingiu+"/"+ideal+")"; }
          else { tdO.style.background="#f8d7da"; tdO.style.color="#842029"; tdO.style.fontWeight="700"; tdO.title="faltam "+(ideal-atingiu)+" saldo(s)"; }
        } else if (statusMes === "ativa"){
          if (atingiu < ideal){
            tdO.style.background="#f8d7da"; tdO.style.color="#842029"; tdO.style.fontWeight="700";
            tdO.title="faltam "+(ideal-atingiu)+" serviço(s)";
          } else if (atingiu === ideal){
            tdO.style.background="#d9ead3"; tdO.style.color="#14532d"; tdO.style.fontWeight="700";
            tdO.title="ideal atingido ("+atingiu+"/"+ideal+")";
          } else {
            tdO.style.background="#f8d7da"; tdO.style.color="#842029"; tdO.style.fontWeight="700";
            tdO.title="acima do ideal ("+atingiu+"/"+ideal+")";
          }
        } else if (atingiu>0){
          if (atingiu>ideal){ tdO.style.background="#f8d7da"; tdO.style.color="#842029"; tdO.style.fontWeight="700"; tdO.title="acima do ideal ("+ideal+")"; }
          else if (atingiu===ideal){ tdO.style.background="#d9ead3"; tdO.style.color="#14532d"; tdO.style.fontWeight="700"; tdO.title="ideal atingido ("+ideal+")"; }
          else tdO.title = "ideal: "+ideal;
        }
      }
    }
    tr.appendChild(tdO);
    const tdC=document.createElement("td"); tdC.className="num"; tdC.textContent=cot||"";
    if (ehAdm && m.cotasAdm>0 && cot>m.cotasAdm){
      tdC.style.background="#f8d7da"; tdC.style.color="#842029"; tdC.style.fontWeight="700";
      tdC.title="cota individual: "+m.cotasAdm;
    }
    tr.appendChild(tdC);
    t.appendChild(tr);
  }

  function linhaVisitante(idx, grupo){
    const ids = vis[sb] || [];
    const id = ids[idx];
    const m = id ? D.mes.find(x=>x.id===id) : null;
    const tr=document.createElement("tr");
    tr.className=(m ? "g"+(m.adm==="S" ? 4 : indiceCorEscala(m.escala))+" " : "")+"linhaMilitar";
    if (id) tr.dataset.militarId = id;
    const tdN=document.createElement("td"); tdN.className="num"; tdN.textContent=idx+1; tr.appendChild(tdN);
    const tdE=document.createElement("td"); tdE.className="escala"; tdE.textContent=m?(m.adm==="S"?rotuloEscala(m):m.escala):""; if (m) tdE.style.background=corEscalaExibicao(m); tr.appendChild(tdE);
    const tdM=document.createElement("td"); tdM.className="mot"; tdM.textContent=m?(m.motorista||""):""; tr.appendChild(tdM);
    const tdP=document.createElement("td"); tdP.className="nome";
    const sel=document.createElement("select");
    sel.className = "selMilitar";
    sel.style.cssText="width:100%";
    sel.innerHTML="<option value=''>— escolher militar —</option>"+D.pessoas.filter(p=>{
      const mm=D.mes.find(x=>x.id===p.id);
      if (!mm) return false;
      if (mm.secao===sb) return false;
      return true;
    }).map(p=>{
      const mm=D.mes.find(x=>x.id===p.id);
      const nm=(p.posto+" "+p.id+" "+p.nome).trim()+" _ "+(mm?mm.secao:"");
      return "<option value='"+p.id+"'"+(id===p.id?" selected":"")+">"+nm+"</option>";
    }).join("");
    const podeVis = podeEditarSB(sb);
    sel.disabled = !podeVis;
    if (!podeVis) sel.classList.add("somenteLeitura");
    sel.onchange=()=>{
      const arr=vis[sb]||[];
      const ok = trocarMilitar("host:"+sb, arr, idx, sel.value||null);
      if (ok){ vis[sb]=arr; salvarLocal(); desenhar(); }
      else { sel.value = arr[idx]||""; }
    };
    tdP.appendChild(sel); tr.appendChild(tdP); anexarBuscaMilitar(sel);
    const tdF=document.createElement("td"); tdF.className="num colF";
    tdF.textContent = (m && fem[m.id])?"F":"";
    tr.appendChild(tdF);
    let ord=0, cot=0;
    dias.forEach(d=>{
      const td=document.createElement("td");
      const dd = fmt(d);
      td.dataset.dia = dd;
      const mae = id ? markMaeDoDia(id, dd) : null;
      if (mae){
        td.textContent = mae.cod;
        td.className = "dia";
        pintar(td, mae.cod, m?m.escala:null);
        if (mae.cod !== "N") celulaFora(td);
        td.title = "SB de origem prevalece: " + localDoGrupo(mae.grupo) + " (não conta no host)";
        td.onclick = null;
      } else {
        celulaMarca(td, grupo, id, dd, m?m.escala:null, ()=>desenhar(), true);
        if (td.textContent==="X") ord++;
        if (td.textContent==="PJ") cot+=2;
        if (["PJ12","PJ12H","SPJ"].includes(td.textContent)) cot+=1;
      }
      tr.appendChild(td);
    });
    const tdO=document.createElement("td"); tdO.className="num"; tdO.textContent=ord||""; tr.appendChild(tdO);
    const tdC=document.createElement("td"); tdC.className="num"; tdC.textContent=cot||""; tr.appendChild(tdC);
    t.appendChild(tr);
  }

  // bloco operacional
  cabecalhoBloco(sb+" — OPERACIONAL");
  pessoasDaSecao(sb).forEach((m,i)=>linhaPessoa(m, sb, i+1));

  // bloco ADM (todas as SBs; a 1ªSB recebe também o ADM central)
  const listaAdm = pessoasAdm(sb);
  if (listaAdm.length){
    cabecalhoBloco("ADMINISTRATIVO (ADM)", "SALDO");
    listaAdm.forEach((m,i)=>linhaPessoa(m, "ADM:"+sb, i+1, true));
  }

  // bloco visitantes
  cabecalhoBloco("VISITANTES — militares de outras SBs");
  const nLinhasVis = Math.max(12, (vis[sb] || []).length, Number(D.visLinhas[sb]) || 0);
  for (let i=0;i<nLinhasVis;i++) linhaVisitante(i, "host:"+sb);

  // totais
  function linhaTot(rot, fn, classe){
    let tfoot = t.querySelector("tfoot");
    if (!tfoot) { tfoot = document.createElement("tfoot"); t.appendChild(tfoot); }

    const tr=document.createElement("tr");
    tr.className="tot";
    const td=document.createElement("td");
    td.colSpan=5;
    td.style.textAlign="center";
    td.style.fontWeight="700";
    td.style.verticalAlign="middle";
    td.textContent=rot;
    tr.appendChild(td);
    const celulas=[td];
    dias.forEach(d=>{
      const c=document.createElement("td");
      const r=fn(d);
      if (typeof r==="object"){ c.innerHTML=r.texto; if(r.classe) c.className=r.classe; }
      else c.textContent=r||"";
      c.style.textAlign="center";
      celulas.push(c);
      tr.appendChild(c);
    });
    const a=document.createElement("td"); const b=document.createElement("td");
    celulas.push(a); celulas.push(b);
    tr.appendChild(a); tr.appendChild(b);
    celulas.forEach(c=>{
      c.style.position="sticky";
      c.style.zIndex="20";
      c.style.backgroundColor="#f1f3f5";
      c.style.boxSizing="border-box";
      c.style.height="24px";
    });
    tfoot.appendChild(tr);
  }
  const meta=D.params.metaBM[sb]||0, metaMot=D.params.metaMot[sb]||0;
  linhaTot("MILITARES POR DIA", d=>contagemSB(sb,d)||"");
  linhaTot("NECESSIDADE DIÁRIA", d=>meta||"");
  linhaTot("SITUAÇÃO", d=>{
    const n=contagemSB(sb,d);
    if (!meta) return {texto:""};
    if (n<meta) return {texto:(meta-n), classe:"falta"};
    return {texto:"OK", classe:"ok"};
  });
  linhaTot("MOTORISTAS", d=>motoristasSB(sb,d)||"");
  linhaTot("SITUAÇÃO MOT.", d=>{
    const n=motoristasSB(sb,d);
    if (!metaMot) return {texto:""};
    if (n<metaMot) return {texto:(metaMot-n), classe:"falta"};
    return {texto:"OK", classe:"ok"};
  });
  linhaTot("EFETIVO FEMININO", d=>{
    const COD_PRESENCA = {"X":1,"PJ":1,"PJ12":1,"PJ12H":1,"SPJ":1,"S1":1};
    let n=0; const dd=fmt(d);
    const conta = (grupo,id)=>{
      if (!fem[id]) return;
      const v = marks[grupo+"|"+id+"|"+dd];
      if (v && COD_PRESENCA[v]) n++;
    };
    pessoasDaSecao(sb).forEach(m=>conta(sb, m.id));
    pessoasAdm(sb).forEach(m=>conta("ADM:"+sb, m.id));
    [...new Set(vis[sb]||[])].forEach(id=>{ if (id) conta("host:"+sb, id); });
    return n||"";
  });

  main.appendChild(t);
  t.querySelectorAll("td.dia[data-cmt-key]").forEach(function(td){
    const ck = td.dataset.cmtKey;
    if (comments[ck]){
      td.classList.add("temComentario");
      const cur = td.title || "";
      if (cur.indexOf("💬") < 0){
        td.title = (cur ? cur + " · " : "") + "💬 " + comments[ck];
      }
    }
  });
  if (podeEditarSB(sb)){
    const addVis = document.createElement("button");
    addVis.textContent = "+ linha";
    addVis.title = "Adicionar uma linha vazia de visitante (não conta nada até escolher o militar)";
    addVis.style.cssText = "margin:8px 0 0;padding:4px 12px;font-size:12px;border:1px solid #adb5bd;border-radius:6px;background:#fff;cursor:pointer";
    addVis.onclick = function(){
      vis[sb] = vis[sb] || [];
      vis[sb].push(null);
      D.visLinhas[sb] = nLinhasVis + 1;
      salvarLocal(); desenhar();
      setTimeout(function(){ revelarUltimaLinhaVisitante(sb); }, 0);
    };
    main.appendChild(addVis);
  }
  requestAnimationFrame(()=>{
    const navEl = document.getElementById("nav");
    const navH = (navEl ? navEl.offsetHeight : 48) || 48;
    const rows = Array.from(t.querySelectorAll("tfoot tr.tot"));
    let acc = navH;
    for (let i = rows.length - 1; i >= 0; i--){
      const h = Math.round(rows[i].getBoundingClientRect().height) || 24;
      rows[i].querySelectorAll("td, th").forEach(td=>{ td.style.bottom = acc + "px"; });
      acc += h;
    }
    document.documentElement.style.setProperty("--nav-h", navH + "px");
    const tf = t.querySelector("tfoot");
    document.documentElement.style.setProperty("--resumo-h", (tf ? tf.offsetHeight : 0) + "px");
    main.style.paddingBottom = (acc + 40) + "px";
  });
}

function revelarUltimaLinhaVisitante(sb){
  const main = document.getElementById("main");
  if (!main) return;
  const selects = main.querySelectorAll("td.nome select");
  if (!selects.length) return;
  const ultima = selects[selects.length - 1];
  const tr = ultima.closest("tr");
  if (!tr) return;
  const tf = main.querySelector("tfoot");
  const resumo = tf ? tf.offsetHeight : 0;
  const nav = document.getElementById("nav");
  const navH = nav ? nav.offsetHeight : 48;
  const header = document.querySelector("header");
  const hdrH = header ? header.getBoundingClientRect().height : 50;
  const limite = window.innerHeight - resumo - navH - 8;
  const topo = hdrH + 8;
  const r = tr.getBoundingClientRect();
  if (r.bottom > limite){
    window.scrollBy(0, Math.ceil(r.bottom - limite) + 4);
  } else if (r.top < topo){
    window.scrollBy(0, Math.floor(r.top - topo) - 2);
  }
}

function celulaMarca(td, grupo, id, dia, escala, recalc, exato){
  if (id) td.dataset.cmtKey = grupo + "|" + id + "|" + dia;
  const mm = id ? D.mes.find(x=>x.id===id) : null;
  let permitido = ehMestre();
  if (!permitido){
    if (String(grupo).indexOf("host:") === 0) permitido = String(grupo).slice(5) === perfilAtual;
    else if (String(grupo).indexOf("ADM:") === 0) permitido = String(grupo).slice(4) === perfilAtual;
    else permitido = String(grupo) === perfilAtual;
  }
  if (mm && mm.afast && mm.afast.length && estaAfastado(mm, new Date(dia+"T12:00:00"))){
    const vAf = id ? getMarkExato(grupo, id, dia) : "";
    td.textContent = "N"; td.className = "dia";
    pintar(td, "N", escala);
    if (vAf === "Nm"){ td.title = "N manual (preservado)"; }
    if (!permitido){ td.classList.add("somenteLeituraN"); return; }
    td.onclick = function(){
      abrirMenuCodigos(td, ["N"], (cod)=>{ if (marcar(grupo, id, dia, cod)) recalc(); });
    };
    return;
  }
  const vExact = id ? getMarkExato(grupo, id, dia) : "";
  const v = id ? (exato ? vExact : getMark(grupo, id, dia)) : "";
  td.textContent = (v === "Nm" ? "N" : v);
  td.className = "dia";
  if (id) pintar(td, v, escala);
  if (id && !exato){
    const dono = donoDaMarca(grupo, id, dia);
    if (dono && dono!==grupo){
      td.title = "Lançado em "+String(dono).replace("host:","").replace(/^ADM:(.*)$/,"$1/ADM");
      if (v && v !== "N") celulaFora(td);
    }
  }
  if (!exato && String(grupo).indexOf("host:") === 0 && v && v !== "N") celulaFora(td);
  // ACO overlay vale em qualquer bloco (operacional, ADM, visitante):
  // se o militar está marcado como 12/24 na ACO e não tem marca própria no dia,
  // mostramos a info em cinza — sem sobrescrever marca real do bloco.
  const acoV = id ? (marks["ACO|"+id+"|"+dia]||"") : "";
  if (!vExact && (acoV==="12" || acoV==="24")){
    // ADM (exato=true) não tem fallback de getMark → a célula ficaria vazia.
    // Escrever o cod do ACO aqui garante visibilidade em qualquer bloco.
    if (!td.textContent) td.textContent = acoV;
    td.classList.add("acoCross");
    celulaFora(td);
    td.title = "ACO: "+acoV+" (não conta nesta SB)";
  }
  if (id) marcarPJInconsistente(td, id, dia, v);
  if (!permitido){ td.classList.add("somenteLeitura"); return; }
  if (id) td.onclick = ()=>{
    const dono = donoDaMarca(grupo, id, dia);
    if (dono && dono!==grupo){
      const nome = String(dono).replace("host:","").replace(/^ADM:(.*)$/,"$1/ADM");
      alert("Esta marca foi lançada em "+nome+". Altere lá.");
      return;
    }
    const cods = (String(grupo).indexOf("ADM:")===0) ? COD : COD_OPER;
    abrirMenuCodigos(td, cods, (cod)=>{ if (marcar(grupo, id, dia, cod)) recalc(); });
  };
}

// ===== Comentários em células (estilo Google Sheets) =====
// Persistência: comments[key] no mesmo estadoSalvavel/aplicarEstado de marks.
// Chave = grupo|id|dia (mesmo padrão de marks). Tipo: string (max 2000 chars).
// UI: clique direito em td.dia → modal para adicionar/editar/remover.
// Indicador: triângulo no canto superior direito (classe temComentario).
// Tooltip: título da célula mostra "💬 texto" (appended em desenharGrade2).
function podeComentarGrupo(grupo){
  if (ehMestre()) return true;
  const g = String(grupo||"");
  if (g.indexOf("host:")===0) return g.slice(5) === perfilAtual;
  if (g.indexOf("ADM:")===0) return g.slice(4) === perfilAtual;
  return g === perfilAtual;
}
function abrirModalComentario(td){
  const key = td.dataset.cmtKey;
  if (!key) return;
  const partes = key.split("|");
  if (partes.length < 3) return;
  const grupo = partes[0], id = partes[1], dia = partes[2];
  const pe = D.pessoas.find(function(x){ return x.id===id; }) || {posto:"", nome:id};
  const atual = comments[key] || "";
  const ctxGrupo = grupo.indexOf("ADM:")===0 ? ("ADM "+grupo.slice(4))
                : grupo.indexOf("host:")===0 ? ("Visitante "+grupo.slice(5))
                : grupo;
  const overlay = document.createElement("div");
  overlay.id = "cmtOverlay";
  const box = document.createElement("div");
  box.id = "cmtBox";
  box.innerHTML = "<h3>Comentário da célula</h3>"
    + "<div class='cmtMeta'>" + esc((pe.posto||"")+" "+(pe.nome||id)) + " (" + esc(id) + ") · " + esc(ctxGrupo) + " · " + dataBR(dia) + "</div>";
  const ta = document.createElement("textarea");
  ta.value = atual;
  ta.placeholder = "Escreva um comentário/justificativa interna para esta célula.";
  ta.maxLength = 2000;
  box.appendChild(ta);
  const row = document.createElement("div");
  row.className = "cmtRow";
  const bCancel = document.createElement("button");
  bCancel.textContent = "Cancelar";
  const bRemover = document.createElement("button");
  bRemover.className = "danger";
  bRemover.textContent = "Remover";
  bRemover.disabled = !atual;
  const bSalvar = document.createElement("button");
  bSalvar.className = "primary";
  bSalvar.textContent = "Salvar";
  row.appendChild(bCancel); row.appendChild(bRemover); row.appendChild(bSalvar);
  box.appendChild(row);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  function fechar(){ if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }
  function salvar(txt){
    txt = String(txt||"").trim();
    if (txt){ comments[key] = txt; }
    else { delete comments[key]; }
    try { salvarLocal(); desenhar(); } catch(e){ console.error("[escala7gb] comentario", e); }
    fechar();
    toast(txt ? "comentário salvo" : "comentário removido");
  }
  bCancel.onclick = fechar;
  bRemover.onclick = function(){ salvar(""); };
  bSalvar.onclick = function(){ salvar(ta.value); };
  overlay.addEventListener("mousedown", function(e){ if (e.target === overlay) fechar(); });
  ta.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ e.preventDefault(); fechar(); }
    else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); salvar(ta.value); }
  });
  setTimeout(function(){ ta.focus(); }, 0);
}
document.addEventListener("contextmenu", function(e){
  const td = e.target && e.target.closest ? e.target.closest("td.dia[data-cmt-key]") : null;
  if (!td) return;
  const partes = String(td.dataset.cmtKey||"").split("|");
  if (partes.length < 3) return;
  if (!podeComentarGrupo(partes[0])){
    e.preventDefault();
    alert("Perfil "+perfilAtual+": você só edita comentários da própria SB.");
    return;
  }
  e.preventDefault();
  abrirModalComentario(td);
});

function montarPainelAjuste(main, sb){

    desenhar();
  }
  function linhaMatriz(rotulo, esc, isAdm){
    const tr = document.createElement("tr");

    tdE.textContent = rotulo;
    tdE.style.cssText = "padding:3px 6px;font-weight:700;border:1px solid #dee2e6;white-space:nowrap";

      const bs = lista.filter(function(m){ return String(m.motorista||"").toUpperCase()==="B"; }).length;
      const td = document.createElement("td");
      const editavel = s2 === sb;
      td.style.cssText = "padding:3px 6px;text-align:center;border:1px solid #dee2e6;cursor:"+(editavel?"pointer":"default")+";"
        + (s2===sb ? "box-shadow:inset 0 0 0 2px #1f3b5c;" : "");
      const zero = !isAdm && ms===0;
      const um = !isAdm && ms===1;
      if (zero){ td.style.background="#f8d7da"; td.style.color="#842029"; td.style.fontWeight="700"; }
      else if (um){ td.style.background="#fff3cd"; td.style.color="#8a4b08"; td.style.fontWeight="700"; }
      td.textContent = lista.length ? lista.length+" ("+ms+"m)" : "0";
      td.title = s2+" · "+rotulo+": "+lista.length+" militar(es); M "+ms+" · B "+bs
        + (zero ? " — equipe sem motorista M" : (um ? " — apenas 1 motorista M" : ""))
        + (editavel ? " · clique para abrir a lista" : " · apenas comparação");
      if (editavel){
        td.tabIndex = 0;
        td.setAttribute("role","button");
        td.onclick = function(){ abrirLista(s2, esc); };
        td.onkeydown = function(ev){ if (ev.key==="Enter" || ev.key===" "){ ev.preventDefault(); abrirLista(s2, esc); } };
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  }
  EQUIPES.forEach(function(e){ linhaMatriz(e, e, false); });
  t.appendChild(tb);
  wrap.appendChild(t);
  det.appendChild(wrap);

  if (ajusteEscalaSel){
    const sSel = ajusteEscalaSel.sb;

      .sort(function(a,b){ return ((a.p&&a.p.ordem)||999)-((b.p&&b.p.ordem)||999); });

    const fechar = document.createElement("button");
    fechar.textContent = "fechar";
    fechar.style.cssText = "margin-left:auto;font-size:10px;padding:1px 6px;cursor:pointer";
    fechar.onclick = function(){ ajusteEscalaSel = null; ajusteEscalaAberto = true; desenhar(); };
    tit.appendChild(fechar);
    box.appendChild(tit);
    if (!lista.length){
      const vazio = document.createElement("div");
      vazio.style.cssText = "font-size:11px;color:#6c757d;padding:3px";
      vazio.textContent = "Nenhum militar nesta escala.";
      box.appendChild(vazio);

    lista.forEach(function(m){
      const row = document.createElement("div");
      row.style.cssText = "display:flex;gap:6px;align-items:center;justify-content:center;text-align:center;border-top:1px solid #f1f3f5;padding:3px 0;font-size:11px;flex-wrap:wrap";

      nm.textContent = (m.p ? (m.p.posto+" "+m.p.nome).trim() : m.id)+" ("+m.id+")"
        + (m.motorista ? " ["+m.motorista+"]" : "");
      row.appendChild(nm);
      const sel = document.createElement("select");
      sel.style.cssText = "font-size:11px;padding:1px;background:"+corEscalaExibicao(m);
      if (isAdm){
        const x = escalaEmX(m);
        sel.innerHTML = "<option value='ALFA'"+(x?"":" selected")+">ADM</option>"
          + "<option value='X - A'"+(x?" selected":"")+">X-ADM</option>";
      } else {
        sel.innerHTML = EQUIPES.map(function(e){ return "<option value='"+e+"'"+(e===m.escala?" selected":"")+">"+e+"</option>"; }).join("");
      }
      sel.onchange = function(){ ajustarEscalaMilitar(m, this.value); };
      row.appendChild(sel);
      box.appendChild(row);
    });
    det.appendChild(box);
  }
  main.appendChild(det);
}

// Modal de confirmação (Promise). Substitui confirm() apenas nos pontos críticos.
function modalConfirm(msg, opts){
  opts = opts || {};
  return new Promise(function(resolve){
    const overlay = document.createElement("div");
    overlay.id = "modalOverlay";
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px";
    const box = document.createElement("div");
    box.style.cssText = "background:#fff;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:14px 16px;font-size:13px;color:#212529";
    const txt = document.createElement("div");
    txt.style.cssText = "white-space:pre-wrap;margin-bottom:12px";
    txt.textContent = String(msg == null ? "" : msg).toUpperCase();
    const row = document.createElement("div");
    row.style.cssText = "display:flex;gap:8px;justify-content:flex-end";
    const bN = document.createElement("button");
    bN.textContent = "Cancelar";
    bN.style.cssText = "padding:6px 14px;border:1px solid #adb5bd;border-radius:6px;background:#fff;cursor:pointer;font-size:12.5px";
    const bS = document.createElement("button");
    bS.textContent = "Confirmar";
    bS.style.cssText = "padding:6px 14px;border:1px solid;border-radius:6px;cursor:pointer;color:#fff;font-size:12.5px;"
      + (opts.perigo ? "background:#b02a37;border-color:#b02a37" : "background:#1f3b5c;border-color:#1f3b5c");
    function fechar(v){
      document.removeEventListener("keydown", onKey);
      overlay.remove();
      resolve(v);
    }
    function onKey(e){ if (e.key === "Escape") fechar(false); }
    bN.onclick = function(){ fechar(false); };
    bS.onclick = function(){ fechar(true); };
    overlay.addEventListener("mousedown", function(e){ if (e.target === overlay) fechar(false); });
    document.addEventListener("keydown", onKey);
    row.appendChild(bN);
    row.appendChild(bS);
    box.appendChild(txt);
    box.appendChild(row);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    bS.focus();
  });
}

    + "</select>";

    try{ localStorage.setItem("escala7gb-perfil", perfilAtual); }catch(e){ console.error("[escala7gb] perfil", e); }
    desenhar();
  };
  if (!ehMestre()){
    const av = document.createElement("p");
    av.style.cssText = "font-size:11.5px;color:#8a6d3b;margin:0 0 8px";
    av.textContent = "Edição restrita à SB do perfil. É apenas proteção contra engano — o arquivo é local.";

  // ---------- oficiais: cadastro (só Mestre) ----------
  if (ehMestre()){
    const ger = document.createElement("div");
    ger.style.cssText = "display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:12px;padding:6px 8px;border:1px solid #dee2e6;border-radius:6px;background:#f8f9fa";
    ger.innerHTML = "<span style='display:flex;gap:6px;align-items:center'>"
      + "<b>Adicionar oficial</b>"
      + "<input id='novoOficial' placeholder='nome do oficial' style='height:28px;width:190px;padding:3px 6px;font-size:12px;box-sizing:border-box'>"
      + "<button id='addOficial' title='Cadastrar novo oficial' style='height:28px;padding:0 10px'>adicionar</button>"
      + "</span>"
      + "<span style='width:1px;height:22px;background:#ced4da;display:inline-block'></span>"
      + "<span style='display:flex;gap:6px;align-items:center'>"

      + "</span>";
