/* ============================================================================
   F5.3 — TRANSPORTE, SESSÃO E TELA DE PIN
   Único ponto de contato com o servidor. Sem google.script.run (abrir por
   file://), o app funciona exatamente como antes: local, sem PIN.
   ========================================================================== */
var BACKEND_URL = (function(){
  try{
    var ls = localStorage.getItem("escala7gb-backend-url");
    if (ls) return ls;
  }catch(e){}
  var m = location.search.match(/[?&]backend=([^&]+)/);
  if (m) return decodeURIComponent(m[1]);
  return "http://localhost:8765";
})();

var ENDPOINT_MAP = {
  apiLogin: "/api/login",
  apiLogout: "/api/logout",
  apiBootstrap: "/api/bootstrap",
  apiPull: "/api/pull",
  apiPush: "/api/push",
  apiListarUsuarios: "/api/listar_usuarios",
  apiCriarUsuario: "/api/criar_usuario",
  apiRevogarUsuario: "/api/revogar_usuario",
  apiRedefinirPin: "/api/redefinir_pin",
  apiEncerrarSessoes: "/api/encerrar_sessoes"
};

var Transport = {
  disponivel: function(){
    try{ return !!(window.google && google.script && google.script.run); }catch(e){ return false; }
  },
  backendDisponivel: function(){
    try{ return !!window.fetch; }catch(e){ return false; }
  },
  call: function(nome, args){
    return new Promise(function(resolve, reject){
      // Apps Script primeiro (producao oficial). Senão cai no backend local.
      if (Transport.disponivel()){
        var r = google.script.run
          .withSuccessHandler(function(res){ resolve(res); })
          .withFailureHandler(function(err){ reject(err); });
        if (typeof r[nome] !== "function") return reject(new Error("endpoint inexistente: " + nome));
        r[nome].apply(r, args || []);
        return;
      }
      if (!Transport.backendDisponivel()) return resolve({ ok: false, offline: true });
      var path = ENDPOINT_MAP[nome];
      if (!path) return reject(new Error("endpoint inexistente: " + nome));
      var body = {};
      if (nome === "apiLogin") body = { pin: args[0] };
      else if (nome === "apiLogout") body = { token: args[0] };
      else if (nome === "apiBootstrap") body = { competencia: args[0], token: args[1] };
      else if (nome === "apiPull") body = { competencia: args[0], token: args[1], desdeVersao: args[2] };
      else if (nome === "apiPush") body = { competencia: args[0], ops: args[1], token: args[2] };
      else if (nome === "apiListarUsuarios") body = { token: args[0] };
      else if (nome === "apiCriarUsuario") body = { token: args[0], nome: args[1], perfil: args[2], pin: args[3] };
      else if (nome === "apiRevogarUsuario") body = { token: args[0], nome: args[1] };
      else if (nome === "apiRedefinirPin") body = { token: args[0], nome: args[1], pin: args[2] };
      else if (nome === "apiEncerrarSessoes") body = { token: args[0], nome: args[1] || null };
      fetch(BACKEND_URL + path, {
        method: "POST",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify(body)
      })
      .then(function(resp){ return resp.json(); })
      .then(function(res){ resolve(res); })
      .catch(function(err){ reject(err); });
    });
  }
};

var Sessao = {
  token: null, perfil: null, nome: null,
  carregar: function(){
    try{
      var j = JSON.parse(localStorage.getItem("escala7gb-sessao") || "null");
      if (j && j.token){ Sessao.token = j.token; Sessao.perfil = j.perfil; Sessao.nome = j.nome; }
    }catch(e){}
    return !!Sessao.token;
  },
  guardar: function(r){
    Sessao.token = r.token; Sessao.perfil = r.perfil; Sessao.nome = r.nome;
    try{ localStorage.setItem("escala7gb-sessao", JSON.stringify({token:r.token, perfil:r.perfil, nome:r.nome})); }catch(e){}
  },
  limpar: function(){
    Sessao.token = null; Sessao.perfil = null; Sessao.nome = null;
    try{ localStorage.removeItem("escala7gb-sessao"); }catch(e){}
  }
};

/* Encerra a sessão: invalida o token NO SERVIDOR e limpa o local.
   Só aparecer quando há backend (botão fica oculto em file://). */
function sair(){
  if (!Transport.disponivel() && !Transport.backendDisponivel()) return;
  if (!Sessao.token){ Sessao.limpar(); location.reload(); return; }
  if (!confirm("Sair da sessão neste navegador?")) return;
  Transport.call("apiLogout", [Sessao.token])
    .catch(function(){ /* mesmo se falhar, limpa o local */ })
    .then(function(){
      Sessao.limpar();
      location.reload();
    });
}

        msg.textContent = "erro de rede: " + (e && e.message || e);
      });
    }
    btn.onclick = tentar;
    inp.addEventListener("keydown", function(ev){ if (ev.key === "Enter") tentar(); });

/* ============================================================================
   F5.3 — ETAPA 4: PULL
   Traz o estado do servidor para o cliente. O servidor passa a ser a fonte
   das marcas; o cadastro (elenco) continua local por enquanto.
   ========================================================================== */
function estadoDoServidor(p){
  var mk = {}, cm = {};
  (p.marcas || []).forEach(function(m){ mk[m.g + "|" + m.i + "|" + m.d] = m.c; });
  (p.comments || []).forEach(function(c){ cm[c.k] = c.v; });
  return {
    marks: mk,
    comments: cm,
    acoOficiais: p.acoOficiais || {},
    movimentos: p.movimentos || [],
    statusMes: (p.meta && p.meta.status) || "ativa",
    vis: (p.meta && p.meta.vis) || {},
    visLinhas: (p.meta && p.meta.visLinhas) || {},
    aco: (p.meta && p.meta.aco) || []
  };
}

/* Aplica um estado vindo do servidor e persiste.
   Usado no pull inicial e na consulta periódica. */
function aplicarRemoto(remoto, ym){
  var local = null;
  try{ local = JSON.parse(localStorage.getItem("escala7gb-" + ym) || "null"); }catch(e){}

  marks = remoto.marks;
  if (Object.keys(remoto.comments).length) comments = remoto.comments;
  if (Object.keys(remoto.acoOficiais).length) D.acoOficiais = remoto.acoOficiais;
  if (remoto.movimentos.length) D.movimentos = remoto.movimentos;
  if (remoto.vis && Object.keys(remoto.vis).length) vis = remoto.vis;
  if (remoto.visLinhas && Object.keys(remoto.visLinhas).length) D.visLinhas = remoto.visLinhas;
  if (remoto.aco && remoto.aco.length) aco = remoto.aco;
  if (remoto.statusMes) statusMes = remoto.statusMes;
  if (local && local.mes) D.mes = local.mes;

  autoX = true;
  reconstruirIndiceMarcas();
  try{ _ultimoSync[ym] = JSON.parse(JSON.stringify(estadoSalvavel())); }catch(e){}
  try{ gravarMes(ym, estadoSalvavel()); }catch(e){ console.error("[sync] gravar pos-pull", e); }
  try{ _tsLocal = {}; }catch(e){}
}

/* ===== consulta periódica: mudanças feitas por outros usuários =====
   5 s com atividade recente · 30 s ocioso · nada com a aba oculta.
   Cada consulta é uma execução no Apps Script: 5 s fixo estouraria a cota. */
var _ultimaInteracao = 0, _ultimaRemota = 0, _pollTimer = null, _pollTick = 0;
var PULL_ATIVO_MS = 5000, PULL_OCIOSO_TICKS = 6, JANELA_ATIVO_MS = 120000;

function _marcarInteracao(){ _ultimaInteracao = Date.now(); }
document.addEventListener("pointerdown", _marcarInteracao, true);
document.addEventListener("keydown", _marcarInteracao, true);

async function atualizarDoServidor(ym){
  if (!Sync.ligado || document.hidden) return;
  if (Sync.estado === "enviando") return;
  if (Sync.fila.length) return;
  if (Date.now() - _ultimaInteracao < 3000) return;

  var r = await Transport.call("apiPull", [ym, Sessao.token, Sync.versao]).catch(function(){ return null; });
  if (!r || !r.ok || r.semMudanca || !r.marcas) return;

  aplicarRemoto(estadoDoServidor(r), ym);
  Sync.versao = r.versao;
  _ultimaRemota = Date.now();
  desenhar();
  try{ status("atualizado — outro usuário gravou"); }catch(e){}
  console.log("[sync] atualizado por outro usuário · versao", r.versao);
}

function agendarPoll(ym){
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTick = 0;
  if (!Sync.ligado) return;
  _pollTimer = setInterval(function(){
    _pollTick++;
    var recente = (Date.now() - Math.max(_ultimaInteracao, _ultimaRemota)) < JANELA_ATIVO_MS;
    if (!recente && (_pollTick % PULL_OCIOSO_TICKS) !== 0) return;
    atualizarDoServidor(ym);
  }, PULL_ATIVO_MS);
}

async function sincronizarMes(ym){
  if (!Transport.disponivel() && !Transport.backendDisponivel()) return false;
  if (!Sessao.token) return false;

  var r = await Transport.call("apiPull", [ym, Sessao.token, null]).catch(function(){ return null; });
  if (!r || !r.ok){
    window.__sync = { ok: false, motivo: (r && (r.erro || "sem resposta")) || "offline" };
    return false;
  }

  Sync.versao = r.versao;
  aplicarRemoto(estadoDoServidor(r), ym);

  // Servidor sem cadastro: envia o elenco uma vez. Sem ele a ACO por SB é
  // recusada (podeGravarGrupo consulta elencoMap). Só as seções que este
  // perfil pode gravar entram — o diff já filtra.
  if (Sync.ligado && !(r.elenco && r.elenco.length)){
    try{
      const atual = estadoSalvavel();
      const semMes = Object.assign({}, atual, { mes: [] });
      const opsEl = diffEstado(semMes, atual).filter(function(o){ return o.t === "elenco"; });
      if (opsEl.length){
        Sync.enfileirar(ym, opsEl);
        console.log("[sync] enviando elenco inicial:", opsEl.length, "militar(es)");
      }
    }catch(e){ console.error("[sync] elenco inicial", e); }
  }

  window.__sync = { ok: true, versao: r.versao, marcas: (r.marcas || []).length, quando: new Date().toISOString() };
  console.log("[sync] pull ok — versao", r.versao, "·", (r.marcas || []).length, "marcas");
  return true;
}

/* Mostra na tela as operações que o servidor recusou. Sem isto, a marca
   desaparece em silêncio e o usuário acha que gravou. */
function mostrarRecusas(){
  var lista = Sync.recusadas || [];
  if (!lista.length) return;
  var velha = document.getElementById("faixaRecusa");
  if (velha) velha.remove();

  var motivos = {};
  lista.forEach(function(x){
    var m = (x && (x.motivo || x.erro)) || "recusado";
    motivos[m] = (motivos[m] || 0) + 1;
  });
  var txt = Object.keys(motivos).map(function(m){ return motivos[m] + "× " + m; }).join(" · ");

  var d = document.createElement("div");
  d.id = "faixaRecusa";
  d.style.cssText = "position:fixed;bottom:0;left:0;right:0;z-index:9998;background:#f8d7da;color:#842029;"
    + "padding:8px 12px;font:600 12.5px system-ui;border-top:3px solid #842029;"
    + "display:flex;gap:10px;align-items:center";
  d.innerHTML = "<span style='flex:1'>" + esc(lista.length) + " operação(ões) recusada(s): " + esc(txt)
    + ". Nada foi gravado — recarregue para ver o estado real.</span>"
    + "<button id='fecharRecusa' style='padding:2px 10px;font-size:12px'>fechar</button>";
  document.body.appendChild(d);
  d.querySelector("#fecharRecusa").onclick = function(){ d.remove(); Sync.recusadas = null; };
  setTimeout(function(){ if (d.parentNode) d.remove(); }, 25000);
}

/* Roda o harness embutido e mostra o resultado numa faixa fixa.
   Use abrindo /exec?testes=1 — sem console. */
function rodarTestesCliente(){
  var r = null;
  try{ r = (window.testes && window.testes.rodar) ? window.testes.rodar() : null; }
  catch(e){ r = null; }
  var box = document.createElement("div");
  box.id = "faixaTestes";
  var antiga = document.getElementById("faixaTestes");
  if (antiga) antiga.remove();
  box.style.cssText = "position:fixed;bottom:0;left:0;right:0;z-index:10000;padding:8px 12px;"
    + "font:600 13px system-ui;border-top:3px solid #495057";
  if (!r){
    box.style.background = "#f8d7da"; box.style.color = "#842029";
    box.textContent = "TESTES CLIENTE: harness não encontrado";
  } else {
    var falhas = (r.resultados || []).filter(function(x){ return x && x.ok === false; })
                   .map(function(x){ return x.nome || "?"; });
    box.style.background = r.fail ? "#f8d7da" : "#d9ead3";
    box.style.color = r.fail ? "#842029" : "#14532d";
    box.textContent = "TESTES CLIENTE: " + r.pass + " PASS · " + r.fail + " FAIL"
      + (falhas.length ? "  —  " + falhas.join(" | ") : "  ✓");
  }
  document.body.appendChild(box);
  console.log("[testes] cliente", r);
  return r;
}

function iniciarApp(){
  // Pop-ups nativos (alert/confirm) em caixa alta, padrão de UI.
  const _alertOriginal = window.alert.bind(window);
  window.alert = function(msg){ _alertOriginal(String(msg == null ? "" : msg).toUpperCase()); };
  const _confirmOriginal = window.confirm.bind(window);
  window.confirm = function(msg){ return _confirmOriginal(String(msg == null ? "" : msg).toUpperCase()); };
  autoX = true;
  atualizarHdrH();
  const _hdrEl = document.querySelector("header");
  if (_hdrEl && window.ResizeObserver){
    new ResizeObserver(atualizarHdrH).observe(_hdrEl);
  }
  window.addEventListener("resize", atualizarHdrH);
  try{
    const of = localStorage.getItem("escala7gb-oficiais");
    if (of){
      const migrado = localStorage.getItem("escala7gb-oficiais-v25");
      const arr = JSON.parse(of) || [];
      D.oficiais = ordenarOficiais(migrado ? arr : arr.concat(D.oficiais));
      if (!migrado) salvarOficiais();
    }
  }catch(e){ console.error("[escala7gb] oficiais (init)", e); }
  if (Sessao && Sessao.token && Sessao.perfil){
    // autenticado: o perfil vem do token, não do dropdown
    perfilAtual = (Sessao.perfil === "Superior") ? "Admin" : Sessao.perfil;
  } else {
    try{
      const pf = localStorage.getItem("escala7gb-perfil");
      if (pf) perfilAtual = pf;
    }catch(e){ console.error("[escala7gb] perfil (init)", e); }
  }
  if (["Admin","Mestre"].concat(SBS).indexOf(perfilAtual) < 0) perfilAtual = "Mestre";
  const selPerfilGlobal = document.getElementById("perfilGlobal");
  if (selPerfilGlobal){
    if (Sessao && Sessao.token){
      selPerfilGlobal.disabled = true;
      selPerfilGlobal.title = "perfil definido pelo login";
    }
    selPerfilGlobal.value = perfilAtual;
    selPerfilGlobal.onchange = function(){
      perfilAtual = this.value;
      try{ localStorage.setItem("escala7gb-perfil", perfilAtual); }catch(e){ console.error("[escala7gb] perfil", e); }
      desenhar();
    };
  }
  carregarEstado();
  const selMes = document.getElementById("mesSel");
  if (selMes) selMes.onchange = function(){ mudarCompetencia(this.value); };
  desenhar();
}

/* ============================================================================
   BOOT — porta de entrada.
   file://            -> entra direto (sem PIN, como sempre foi)
   dentro do Apps Script -> exige PIN antes de renderizar qualquer dado
   ========================================================================== */
(function boot(){
  var mainEl = document.getElementById("main");
  if (!Transport.disponivel() && !Transport.backendDisponivel()){ iniciarApp(); return; }

  if (mainEl) mainEl.style.visibility = "hidden";

  var ym = String(D.competencia).slice(0, 7);

  function entrar(){
    Sync.iniciar();
    iniciarApp();
    if (mainEl) mainEl.style.visibility = "";
    atualizarBotaoSair();
    if (location.search.indexOf("testes=1") >= 0) setTimeout(rodarTestesCliente, 400);
  }

  // estado LOCAL primeiro (carregarEstado), depois o pull, depois redesenha.
  // Invertido, carregarEstado sobrescrevia o que o pull acabou de trazer e o
  // diff virava centenas de exclusões.
  function entrarComSync(){
    entrar();
    sincronizarMes(ym).then(function(ok){
      if (!ok) return;
      carregarEstado();
      desenhar();
      if (Sync.ligado && !Sync.fila.length){ Sync.estado = "ok"; Sync.pintar(); }
      agendarPoll(ym);
    }, function(){});
  }

  if (!Sessao.carregar()){ pedirPin().then(entrarComSync); return; }

  Transport.call("apiBootstrap", [ym, Sessao.token])
    .then(function(b){
      if (b && b.ok){ entrarComSync(); return; }
      Sessao.limpar();
      pedirPin().then(entrarComSync);
    })
    .catch(function(){ entrar(); });   // falha de rede: não trava o app
})();

</script>

      const c1 = ops1.filter(function(o){ return o.t === "comment"; });
      ok("Achado 2a: diffEstado emite op comment novo (k1)",
         c1.length === 1 && c1[0].k === "k1" && c1[0].v === "nota A",
         "commentOps=" + JSON.stringify(c1));

      aplicarOps(ops1);
      ok("Achado 2b: aplicarOps aplica comment em comments{}",
         comments["k1"] === "nota A",
         "comments.k1=" + comments["k1"]);

      const ops2 = diffEstado(s1, s2);
      const c2 = ops2.filter(function(o){ return o.t === "comment"; });
      ok("Achado 2c: diff subsequente detecta só k2 (não repete k1)",
         c2.length === 1 && c2[0].k === "k2",
         "commentOps=" + JSON.stringify(c2));
    } finally {
      comments = origComments;
      _ultimoSync = origUltimo;
      _tsLocal = origTsLocal;
      D.competencia = origCompetencia;
    }
  }

  function testesDoisClientesChavesDiferentes(){
    const origUltimo = _ultimoSync;
    const origTsLocal = _tsLocal;
    const origCompetencia = D.competencia;
    const origMarks = Object.assign({}, marks);
    try {
      _ultimoSync = {};
      _tsLocal = {};
      D.competencia = "2026-11-01";
      Object.keys(marks).forEach(function(k){ delete marks[k]; });
      reconstruirIndiceMarcas();

      const base = {marks: {}, comments: {}, mes: []};
      const cliA = {marks: {"1ªSB|722022-7|2026-11-03": "X"}, comments: {}, mes: []};
      const cliB = {marks: {"1ªSB|722022-7|2026-11-07": "X"}, comments: {}, mes: []};
      const opsA = diffEstado(base, cliA);
      const opsB = diffEstado(base, cliB);

      aplicarOps(opsA);
      aplicarOps(opsB);

      const okA = marks["1ªSB|722022-7|2026-11-03"] === "X";
      const okB = marks["1ªSB|722022-7|2026-11-07"] === "X";
      ok("Teste 7: 2 clientes em chaves diferentes → ambas sobrevivem",
         okA && okB, "dia03=" + okA + " dia07=" + okB);
    } finally {
      _ultimoSync = origUltimo;
      _tsLocal = origTsLocal;
      D.competencia = origCompetencia;
      Object.keys(marks).forEach(function(k){ delete marks[k]; });
      Object.keys(origMarks).forEach(function(k){ marks[k] = origMarks[k]; });
      reconstruirIndiceMarcas();
    }
  }

  function testesPropagacao(){
    setup();
    // Simula salvar um mês futuro e verificar se propagarRemocaoAfastamento limpa
    const chaveFut = "escala7gb-2026-12";
    const estadoOrig = localStorage.getItem(chaveFut);
    try {
      const j = {
        competencia: "2026-12-01",
        mes: [{id:"P1", secao:"1ªSB", escala:"X - A", escalaOrigem:"ALFA", adm:"", motorista:"M",
               afast:[{ini:"2026-11-20", fim:"2026-12-10"}]}],
        marks: {}, vis: {}, visLinhas: {}, aco: [], params: {}, removidos: {},
        acoOficiais: {}, afastMesclado: true
      };
      localStorage.setItem(chaveFut, JSON.stringify(j));
      const n = propagarRemocaoAfastamento("P1", "2026-11-20", "2026-12-10");
      const j2 = JSON.parse(localStorage.getItem(chaveFut));
      const m2 = j2.mes.find(x => x.id === "P1");
      ok("propagarRemocaoAfastamento limpa afast em mês futuro",
         n === 1 && m2.afast.length === 0, "n=" + n + " afast=" + m2.afast.length);
      ok("propagarRemocaoAfastamento restaura escalaOrigem",
         m2.escala === "ALFA", "escala=" + m2.escala);
    } finally {
      if (estadoOrig === null) localStorage.removeItem(chaveFut);
      else localStorage.setItem(chaveFut, estadoOrig);
    }
  }

  function testesIdealX(){
    setup();
    // X-D (origem DELTA), afast 16-30/11. Em nov/2026 DELTA cai em
    // 03,07,11,15,19,23,27 (7 dias). Afast 16-30 cobre 19,23,27 (3 dias).
    const m = D.mes.find(x => x.id === "P1");
    m.escalaOrigem = "DELTA";
    m.escala = "X - D";
    m.afast = [{ini:"2026-11-16", fim:"2026-11-30"}];
    const dComAfast = diasAfastados(m);
    m.afast = [];
    const dSemAfast = diasAfastados(m);
    ok("diasAfastados em X-D: 3 com afast, 7 sem afast",
       dComAfast === 3 && dSemAfast === 7,
       "com=" + dComAfast + " sem=" + dSemAfast);

    m.afast = [{ini:"2026-11-16", fim:"2026-11-30"}];
    const gi = ORDEM_ESC[m.escalaOrigem];
    const dias = diasDoMes();
    const diasServico      = dias.filter(d => indiceEquipe(d) === gi).length;
    const diasAfastServico = dias.filter(d => indiceEquipe(d) === gi && estaAfastado(m, d)).length;
    const ideal = Math.max(0, diasServico - diasAfastServico);
    ok("ideal de X-D com afast 16-30 = 4 (coerente com diasAfastados)",
       ideal === 4 && dComAfast === diasAfastServico,
       "ideal=" + ideal + " inline=" + diasAfastServico + " diasAfastados=" + dComAfast);

    const m2 = D.mes.find(x => x.id === "P2");
    m2.escala = "ALFA";
    m2.afast = [{ini:"2026-11-16", fim:"2026-11-30"}];
    ok("diasAfastados em ALFA não-X não regride (4)",
       diasAfastados(m2) === 4, "obtido " + diasAfastados(m2));
  }

  function imprimir(){
    const pass = resultados.filter(r => r.ok).length;
    const fail = resultados.length - pass;
    console.table(resultados.map(r => ({
      Teste: r.nome,
      Status: r.ok ? "PASS" : "FAIL",
      Detalhe: r.detalhe
    })));
    console.log("%c" + pass + "/" + resultados.length + " passaram · " + fail + " falharam",
      "font-weight:bold;color:" + (fail ? "#842029" : "#14532d"));
    return {total: resultados.length, pass, fail, resultados};
  }

  window.testes = { rodar, resultados };
  console.log("[testes] harness instalado. Rode: window.testes.rodar()");
})();
